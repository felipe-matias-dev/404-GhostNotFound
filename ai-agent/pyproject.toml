[project]
name = "venergy-agent"
version = "0.1.0"
description = "Agente Text-to-SQL do V-Energy Grid 360"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.11",
    "pydantic-ai-slim[google,openrouter]>=2.59.0",
    "pydantic-settings>=2.10",
    "pyyaml>=6.0.3",
    "sqlglot>=30.23.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/venergy_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning:google.genai.*"]

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
