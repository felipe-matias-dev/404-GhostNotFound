- id: G138~livre1
  question: Comparando o arranque da base com os últimos doze meses, qual foi a variação percentual do volume de suprimento
    medido e da entrada financeira bruta?
  category: parafrase
  reference_sql: WITH meses AS (SELECT competencia, row_number() OVER (ORDER BY competencia) AS ordem_inicio, row_number()
    OVER (ORDER BY competencia DESC) AS ordem_fim FROM sem_kpis_mensais) SELECT round(100.0 * (sum(CASE WHEN m.ordem_fim <=
    12 THEN k.kwh_faturado END) - sum(CASE WHEN m.ordem_inicio <= 12 THEN k.kwh_faturado END)) / NULLIF(sum(CASE WHEN m.ordem_inicio
    <= 12 THEN k.kwh_faturado END), 0), 2) AS variacao_energia_pct, round(100.0 * (sum(CASE WHEN m.ordem_fim <= 12 THEN k.receita_faturada
    END) - sum(CASE WHEN m.ordem_inicio <= 12 THEN k.receita_faturada END)) / NULLIF(sum(CASE WHEN m.ordem_inicio <= 12 THEN
    k.receita_faturada END), 0), 2) AS variacao_receita_pct FROM sem_kpis_mensais k JOIN meses m ON m.competencia = k.competencia
  parts:
  - - variacao_energia_pct
  - - variacao_receita_pct
  expected_status: answered
  datasets:
  - gold_real
  follow_up_of: null
  origem: G138
  revisado_por: null
