- id: G057~livre1
  question: De dois mil e vinte e quatro pra dois mil e vinte e cinco, quantos endereços com placas solares lá em Olinda viram
    o uso de eletricidade despencar mais de trinta por cento?
  category: parafrase
  reference_sql: WITH base AS (SELECT f.cod_uc, avg(f.kwh_faturado) AS kwh FROM sem_faturamento_mensal f JOIN sem_uc u ON
    u.cod_uc = f.cod_uc WHERE u.possui_gd AND u.municipio ILIKE 'Olinda' AND f.competencia LIKE '2024-%' GROUP BY f.cod_uc),
    atual AS (SELECT f.cod_uc, avg(f.kwh_faturado) AS kwh FROM sem_faturamento_mensal f JOIN sem_uc u ON u.cod_uc = f.cod_uc
    WHERE u.possui_gd AND u.municipio ILIKE 'Olinda' AND f.competencia LIKE '2025-%' GROUP BY f.cod_uc) SELECT count(*) AS
    total FROM base b JOIN atual a ON a.cod_uc = b.cod_uc WHERE a.kwh < 0.7 * b.kwh
  expected_status: answered
  datasets:
  - gold_real
  follow_up_of: null
  origem: G057
  revisado_por: null
