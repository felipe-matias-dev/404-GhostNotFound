  # --- case: perguntas do diagnóstico de receita (planejamento §3) ---

  - id: G041
    question: "A tarifa média residencial subiu entre o primeiro ano da base e os últimos 12 meses?"
    category: case
    reference_sql: "WITH meses AS (SELECT competencia, row_number() OVER (ORDER BY competencia) AS ordem_inicio, row_number() OVER (ORDER BY competencia DESC) AS ordem_fim FROM (SELECT DISTINCT competencia FROM sem_faturamento_mensal) c) SELECT sum(CASE WHEN m.ordem_inicio <= 12 THEN f.receita_energia END) / NULLIF(sum(CASE WHEN m.ordem_inicio <= 12 THEN f.kwh_faturado END), 0) AS tarifa_primeiro_ano, sum(CASE WHEN m.ordem_fim <= 12 THEN f.receita_energia END) / NULLIF(sum(CASE WHEN m.ordem_fim <= 12 THEN f.kwh_faturado END), 0) AS tarifa_ultimos_12_meses FROM sem_faturamento_mensal f JOIN meses m ON m.competencia = f.competencia JOIN sem_uc u ON u.cod_uc = f.cod_uc WHERE u.classe = 'B1'"
    expected_status: answered
    follow_up_of: null
    notes: "Pergunta do case (planejamento §3, '10,5%'). A referência devolve as duas tarifas, que respondem 'subiu?'. A variação percentual é opcional, porque colunas extras do agente são ignoradas. Primeiro ano e últimos 12 meses saem das competências que existem (row_number). Tarifa é receita de energia (sem tributos) ÷ energia faturada (DEC-023). A resposta declara a suposição. Mudança de 0.2.0 para 0.4.0 (24/10/2026, feita depois de ver rodadas do modelo): (1) a referência usava 2024 e 2025 fixos, que não valem para a Gold real; agora usa os meses existentes (row_number), com o mesmo resultado na amostra. (2) Passou a devolver as duas tarifas, em vez de só a variação percentual. A mudança (2) é discutível, porque aproxima o gabarito da forma que o agente responde. Pendente de revisão por Dados. Conferência de Dados (27/10/2026): bate com o case (Henrique: reajuste da tarifa residencial, volume e receita dos últimos 12 meses contra o primeiro ano). A referência roda na Gold real e a tarifa média efetiva sobe. O reajuste de 10,5% do case é o da tarifa base, sem a bandeira, então a tarifa média efetiva sobe mais que isso. Revisado por Dados."
