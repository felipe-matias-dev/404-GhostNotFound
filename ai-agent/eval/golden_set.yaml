  - id: G019
    question: "Qual foi a tarifa média residencial em julho de 2021?"
    category: temporal
    reference_sql: "SELECT sum(f.receita_energia) / NULLIF(sum(f.kwh_faturado), 0) AS tarifa_media FROM sem_faturamento_mensal f JOIN sem_uc u ON u.cod_uc = f.cod_uc WHERE u.classe = 'B1' AND f.competencia = '2021-07'"
    expected_status: answered
    follow_up_of: null
    notes: "Competência fora dos dados da amostra (2024-01 a 2025-12). Pela spec §5.1 (item 6), resultado vazio é answered com confiança low: o agente não distingue zero de dado ausente e diz que nenhum registro atende. A Gold real vai de 2022-07 a 2026-06, e por isso a pergunta usa julho de 2021, fora das duas bases. Achado 1 da §9.6. Mudança de 0.2.0 para 0.4.0 (24/10/2026, feita depois de ver rodadas do modelo): período fora dos dados. O esperado `unknown` contradizia a spec §5.1 (item 6), que manda responder resultado vazio com confiança low. O esperado passou a `answered`, com uma referência de resultado vazio. Revisão de Dados (27/10/2026): a pergunta pedia julho de 2022, que existe na Gold real e deixaria de testar o resultado vazio; passou a julho de 2021, fora da amostra e da Gold. Pendente de revisão por Dados. Conferência de Dados (27/10/2026): a Patrícia exige que o agente diga que não sabe quando não souber. Este item só atende isso se a resposta disser que não há dados do período, e não zero. O período está fora da Gold real (conferido). Sem revisor até o GenAI decidir o critério: resposta com 'sem dados' ou status unknown."
    revisado_por: null

