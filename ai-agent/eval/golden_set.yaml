    reference_sql: "SELECT count(DISTINCT u.cod_uc) AS total FROM sem_uc u JOIN sem_faturamento_mensal f ON f.cod_uc = u.cod_uc WHERE u.cod_alimentador = 'AL-07' AND f.competencia = '2025-06'"
    expected_status: answered
    datasets: [amostra]
    follow_up_of: null
    notes: "Conta UCs distintas, não faturas. Conferência de Dados (29/10/2026): a referência foi executada na amostra pelo caminho do agente (validador e executor) e volta com resultado; na Gold real o código não existe. responde à pergunta com o mesmo período, recorte e medida. Revisado por Dados."
    revisado_por: "Alisson Ramos"

  - id: G013
    question: "Qual a receita faturada média por UC residencial em Olinda em junho de 2025?"
    category: juncao
    reference_sql: "SELECT round(avg(f.receita_faturada), 2) AS receita_media FROM sem_uc u JOIN sem_faturamento_mensal f ON f.cod_uc = u.cod_uc WHERE u.classe = 'B1' AND u.municipio ILIKE 'Olinda' AND f.competencia = '2025-06'"
    expected_status: answered
    datasets: [amostra, gold_real]
    follow_up_of: null
    notes: "Classe e município vêm da UC; a fatura tem uma linha por UC e competência. Conferência de Dados (29/10/2026): a referência foi executada na amostra e na Gold real pelo caminho do agente (validador e executor) e volta com resultado nas duas bases; responde à pergunta com o mesmo período, recorte e medida. Revisado por Dados."
    revisado_por: "Alisson Ramos"

  - id: G014
    question: "Quanta energia foi faturada em junho de 2025 nas UCs com painel solar?"
    category: juncao
    reference_sql: "SELECT sum(kwh_faturado) AS kwh FROM sem_kpis_segmento_mensal WHERE possui_gd AND competencia = '2025-06'"
    expected_status: answered
    datasets: [amostra, gold_real]
    follow_up_of: null
    notes: "kWh já líquido de GD: a soma não desconta a geração de novo. Mudança na 0.13.0 (Dados, 29/10/2026): a referência usava o possui_gd do cadastro (sem_uc), que inclui UCs que conectaram a GD depois de junho de 2025; na Gold real isso muda bastante o número. Pela DEC-023, a UC conta como GD a partir do mês da conexão, então a referência passa a sem_kpis_segmento_mensal com possui_gd na competência, que dá o mesmo valor que o cadastro filtrado por data_conexao_gd até o fim do mês. A leitura do agente na linha de base 2 estava certa, e o gabarito é que estava errado (como no G062). Na amostra as duas leituras coincidem, porque toda GD da amostra é anterior a 2024. Conferência de Dados (29/10/2026): a referência foi executada na amostra e na Gold real pelo caminho do agente (validador e executor) e volta com resultado nas duas bases. Revisado por Dados."
    revisado_por: "Alisson Ramos"

  # --- temporal: comparação entre períodos ---

  - id: G015
    question: "Quanto a receita faturada cresceu entre 2024 e 2025?"
    category: temporal
    reference_sql: "SELECT round(100.0 * (a.total - b.total) / NULLIF(b.total, 0), 2) AS variacao_percentual FROM (SELECT sum(receita_faturada) AS total FROM sem_faturamento_mensal WHERE competencia LIKE '2025-%') a, (SELECT sum(receita_faturada) AS total FROM sem_faturamento_mensal WHERE competencia LIKE '2024-%') b"
    expected_status: answered
    datasets: [amostra, gold_real]
    follow_up_of: null
    notes: "Variação calculada pelo banco, com divisão protegida por NULLIF. Os dois anos estão na pergunta: não precisa de esclarecimento. Conferência de Dados (29/10/2026): a referência foi executada na amostra e na Gold real pelo caminho do agente (validador e executor) e volta com resultado nas duas bases; responde à pergunta com o mesmo período, recorte e medida. Revisado por Dados."
    revisado_por: "Alisson Ramos"

  - id: G016
    question: "Qual a variação da energia faturada residencial entre 2024 e 2025?"
    category: temporal
