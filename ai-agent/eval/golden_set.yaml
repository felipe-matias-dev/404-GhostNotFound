    expected_status: answered
    datasets: [amostra, gold_real]
    follow_up_of: null
    notes: "possui_gd é booleano: o filtro é direto, sem comparar com texto. Conferência de Dados (29/10/2026): a referência foi executada na amostra e na Gold real pelo caminho do agente (validador e executor) e volta com resultado nas duas bases; responde à pergunta com o mesmo período, recorte e medida. Revisado por Dados."
    revisado_por: "Alisson Ramos"

  - id: G005
    question: "Qual foi a receita da distribuidora em setembro de 2024?"
    category: simples
    reference_sql: "SELECT sum(receita_faturada) AS receita FROM sem_faturamento_mensal WHERE competencia = '2024-09'"
    expected_status: answered
    datasets: [amostra, gold_real]
    follow_up_of: null
    notes: "'Receita' sem qualificador é receita faturada; a resposta declara essa suposição (regra da camada semântica). Conferência de Dados (29/10/2026): a referência foi executada na amostra e na Gold real pelo caminho do agente (validador e executor) e volta com resultado nas duas bases; responde à pergunta com o mesmo período, recorte e medida. A mesma pergunta está nos exemplos few-shot da camada, o que mede memória (comentário na issue #90). Revisado por Dados. Mudança na 0.15.0 (GenAI, 30/10/2026, issue #90 item 1): a pergunta era igual a um exemplo few-shot da camada, o que media memória; a pergunta foi reescrita e o mês passou de março de 2025 para setembro de 2024, que tem dados nas duas bases. Conferido por Dados no PR #97 (Alisson Ramos, 30/10/2026)."
    revisado_por: "Alisson Ramos"

