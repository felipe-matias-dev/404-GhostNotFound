  - id: G057
    question: "Entre 2024 e 2025, quantas UCs com painel solar em Olinda tiveram queda de consumo acima de 30%?"
    category: case
    reference_sql: "WITH base AS (SELECT f.cod_uc, avg(f.kwh_faturado) AS kwh FROM sem_faturamento_mensal f JOIN sem_uc u ON u.cod_uc = f.cod_uc WHERE u.possui_gd AND u.municipio ILIKE 'Olinda' AND f.competencia LIKE '2024-%' GROUP BY f.cod_uc), atual AS (SELECT f.cod_uc, avg(f.kwh_faturado) AS kwh FROM sem_faturamento_mensal f JOIN sem_uc u ON u.cod_uc = f.cod_uc WHERE u.possui_gd AND u.municipio ILIKE 'Olinda' AND f.competencia LIKE '2025-%' GROUP BY f.cod_uc) SELECT count(*) AS total FROM base b JOIN atual a ON a.cod_uc = b.cod_uc WHERE a.kwh < 0.7 * b.kwh"
    expected_status: answered
    follow_up_of: null
    notes: "Versão da pergunta da Patrícia com os períodos. Suposição a declarar: queda = média mensal de 2025 contra a média de 2024, por UC. Queda acima de 30% = média atual abaixo de 70% da anterior. Mudança de 0.2.0 para 0.4.0 (24/10/2026, feita depois de ver rodadas do modelo): só a nota; a referência não mudou. Pendente de revisão por Dados. Conferência de Dados (27/10/2026): bate com a pergunta da Patrícia (UCs com painel solar em Olinda com queda de consumo acima de 30%). O case não fixa o período, então 2024 e 2025 é suposição declarada. A referência roda na Gold real e devolve resultado. Revisado por Dados."
    revisado_por: "Alisson Ramos"

