    reference_sql: "SELECT sum(CASE WHEN competencia BETWEEN '2024-01' AND '2024-06' THEN dec END) AS dec_2024, sum(CASE WHEN competencia BETWEEN '2025-01' AND '2025-06' THEN dec END) AS dec_2025 FROM sem_continuidade_alimentador_mensal WHERE cod_alimentador = 'AL-07'"
    expected_status: answered
    follow_up_of: null
    notes: "O DEC de cada semestre é a soma do DEC mensal pronto da view, calculada no SQL; a resposta compara os dois números, sem fazer conta. Mudança de 0.2.0 para 0.4.0 (24/10/2026, feita depois de ver rodadas do modelo): a referência devolvia 12 linhas mensais e deixava a comparação para a resposta, o que obriga o LLM a fazer contas (contra o CLAUDE.md do agente). Agora devolve o DEC de cada semestre somado no SQL. A soma depende da DEC-032 (proposta). Pendente de revisão por Dados. Conferência de Dados (27/10/2026): bate com o pedido da Beatriz (DEC por alimentador ao longo do tempo) e com o glossário do case (DEC calculado pelo PRODIST; os valores servem para comparar alimentadores e períodos). A soma dos DEC mensais é a forma da DEC-032, aprovada por Dados. Sem revisor: o alimentador é fictício da amostra, e o resultado só pode ser conferido na amostra."
    revisado_por: null

