# Golden set do agente Text-to-SQL (spec §9.1; guia §10.1).
#
# Cada item é uma pergunta com o resultado esperado. expected_status segue o AnswerStatus:
#   answered  o agente consulta e responde com números das linhas
#   unknown   a informação não existe nas views (não é "zero": é "não sei")
#   clarify   a pergunta admite interpretações que mudam o número
#   refused   pedido de escrita, de manipulação ou de acesso fora do escopo
# failed nunca é esperado: é falha técnica, não comportamento.
#
# reference_sql é o SQL de referência, escrito para as views sem_* da camada semântica
# (ai-agent/semantic/semantic_layer.yaml). Só existe quando o esperado é answered.
#
# STATUS: rascunho sem revisão humana. revisado_por fica null até uma pessoa conferir o item,
# o SQL e o resultado no banco com dados. Gabarito sem revisão torna a avaliação circular (spec §9.1).
# Os testes verificam estrutura, cobertura e que cada reference_sql executa no banco de teste.
# A acurácia só vale com a amostra ou a Gold real (PR #17 e D4 da spec).
#
# Origem das perguntas: falas das lideranças no material do case (pasta Contexto,
# RESUMO_CONTEXTO.md §1.2, §1.3 e §1.7; case p. 5 e 6), planejamento §3, guia §10.1 e casos de
# borda do domínio. A origem de cada item está no campo notes.

# Histórico de versões (cada rodada em eval/runs/ grava golden_version):
#   0.2.0  PR #32: 66 itens, rascunho, alinhado à camada semântica v0.2.
#   0.4.0  PR #41: G019, G020, G029, G030, G041, G042, G043, G061 e G066 mudaram de referência ou de
#          esperado, e G046 e G057 só de nota. O motivo de cada mudança está na nota do item. As
#          mudanças foram feitas depois de ver rodadas do modelo, então nenhum item tem revisado_por
#          até a revisão independente por Dados.
#   0.5.0  Revisão de Dados (27/10/2026), conferida na Gold v0.3: G019 passou de julho de 2022, que existe na
#          Gold, para julho de 2021, que não existe; G010 passou a usar o DEC do grupo de alimentadores (DEC-032).
#          Os outros itens que mudaram na 0.4.0 foram conferidos e ficam como estão. revisado_por foi preenchido (Alisson
#          Ramos, Dados) em G041, G042, G043, G057 e G066, conferidos contra o texto do case e na Gold real; nos demais
#          continua nulo até a conferência de quem escreve o próprio nome.
versao: 0.5.0
status: rascunho

