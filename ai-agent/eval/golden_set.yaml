  # --- case: perguntas do diagnóstico de receita (planejamento §3) ---

  - id: G041
    question: "A tarifa média residencial subiu entre o primeiro ano da base e os últimos 12 meses?"
    category: case
    reference_sql: "SELECT round(100.0 * (a.tarifa - b.tarifa) / NULLIF(b.tarifa, 0), 2) AS variacao_percentual FROM (SELECT sum(f.receita_energia) / NULLIF(sum(f.kwh_faturado), 0) AS tarifa FROM sem_faturamento_mensal f JOIN sem_uc u ON u.cod_uc = f.cod_uc WHERE u.classe = 'B1' AND f.competencia BETWEEN '2025-01' AND '2025-12') a, (SELECT sum(f.receita_energia) / NULLIF(sum(f.kwh_faturado), 0) AS tarifa FROM sem_faturamento_mensal f JOIN sem_uc u ON u.cod_uc = f.cod_uc WHERE u.classe = 'B1' AND f.competencia BETWEEN '2024-01' AND '2024-12') b"
    expected_status: answered
    follow_up_of: null
    notes: "Pergunta do case (planejamento §3, '10,5%'). Primeiro ano = 2024 e últimos 12 meses = 2025, com base em docs/arquitetura.md. Tarifa é receita de energia (sem tributos) ÷ energia faturada, como no contrato v0.2 (DEC-023). A resposta declara a suposição."
    revisado_por: null

  - id: G042
    question: "A energia faturada caiu nos últimos 12 meses em relação ao primeiro ano da base?"
    category: case
