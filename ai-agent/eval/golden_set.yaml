# Golden set do agente Text-to-SQL (spec §9.1; guia §10.1).
#
# Cada item é uma pergunta com o resultado esperado. expected_status segue o AnswerStatus:
#   answered  o agente consulta e responde com números das linhas
#   unknown   a informação não existe nas views (não é "zero": é "não sei")
#   clarify   a pergunta admite interpretações que mudam o número
#   refused   pedido de escrita, de manipulação ou de acesso fora do escopo
# failed nunca é esperado: é falha técnica, não comportamento.
#
# reference_sql é o SQL de referência, escrito para as views sem_* da camada semântica
# (ai-agent/semantic/semantic_layer.yaml). Só existe quando o esperado é answered. Um item da Gold
# real cujo gabarito é um número publicado usa expected_values (coluna: valor) no lugar do SQL.
#
# datasets diz em que base o item vale: amostra, gold_real ou as duas (issue #56). Item com código
# fictício da amostra (UC 0003, AL-07) fica só na amostra: na Gold real o código não existe, e código
# real de UC não sobe ao repositório (DEC-024). A classificação é a primeira do GenAI; Dados confirma
# na revisão de cada item.
#
# Uma referência que volta sem dados não conta como acerto: vira erro de gabarito. Só os itens de
# período fora dos dados têm allow_empty_reference: true, porque o vazio é a resposta certa.
#
# STATUS: rascunho sem revisão humana. revisado_por fica null até uma pessoa conferir o item,
# o SQL e o resultado no banco com dados. Gabarito sem revisão torna a avaliação circular (spec §9.1).
# Os testes verificam estrutura, cobertura e que cada reference_sql executa no banco de teste.
# A acurácia só vale com a amostra ou a Gold real (PR #17 e D4 da spec).
#
# Origem das perguntas: falas das lideranças no material do case (pasta Contexto,
# RESUMO_CONTEXTO.md §1.2, §1.3 e §1.7; case p. 5 e 6), planejamento §3, guia §10.1 e casos de
# borda do domínio. A origem de cada item está no campo notes.

# Histórico de versões (cada rodada em eval/runs/ grava golden_version):
#   0.2.0  PR #32: 66 itens, rascunho, alinhado à camada semântica v0.2.
#   0.4.0  PR #41: G019, G020, G029, G030, G041, G042, G043, G061 e G066 mudaram de referência ou de
#          esperado, e G046 e G057 só de nota. O motivo de cada mudança está na nota do item. As
#          mudanças foram feitas depois de ver rodadas do modelo, então nenhum item tem revisado_por
#          até a revisão independente por Dados.
#   0.5.0  Revisão de Dados (27/10/2026), conferida na Gold v0.3: G019 passou de julho de 2022, que existe na
#          Gold, para julho de 2021, que não existe; G010 passou a usar o DEC do grupo de alimentadores (DEC-032).
#          Os outros itens que mudaram na 0.4.0 foram conferidos e ficam como estão. revisado_por foi preenchido (Alisson
#          Ramos, Dados) em G041, G042, G043, G057 e G066, conferidos contra o texto do case e na Gold real; nos demais
#          continua nulo até a conferência de quem escreve o próprio nome.
#   0.6.0  Issue #56: datasets em todos os itens e allow_empty_reference em G019, G029 e G030. Nenhuma
#          pergunta, referência ou esperado mudou. Numerada depois da 0.5.0 do PR #57 (Dados).
#   0.8.0  Dados (issue #56): G026 passou de março para fevereiro de 2025 e G059 de Jaboatão para Recife, porque a
#          amostra não tem nota de satisfação em março nem UC comercial em Jaboatão; nas duas bases a referência
#          volta com resultado. G076 a G087: conjunto gold_real, com expected_values tirados do diagnóstico
#          (docs/diagnostico-receita.md) e conferidos na Gold real. G088 a G093: equivalentes agregados, na Gold
#          real, dos itens com código fictício (G009, G011, G012, G020, G022 e G061), só com nomes já publicados.
#          Numerada depois da 0.7.0 do PR #67 (GenAI), que entrou depois, como 0.9.0.
#   0.9.0  Camada semântica 0.4.0 (contrato da Gold v0.3), PR #67, escrita como 0.7.0 e renumerada
#          depois da 0.8.0: G062 passa de unknown a answered, pelas
#          interrupções da própria UC (decisão da issue #56), e entram G067 a G074, sobre interrupções,
#          atendimentos e medidor por UC, inadimplência, leitura estimada e GD. Escritos antes de qualquer
#          rodada do modelo, conferidos na amostra; pendentes de revisão por Dados. G075 (inspeções, fora do
#          agente) repõe o mínimo de 8 perguntas sem resposta. Revisão de Dados (28/10/2026): revisado_por
#          preenchido (Alisson Ramos) em G062, G067, G069, G070, G073, G074 e G075; G068, G071 e G072 esperam
#          o ajuste pedido na revisão do PR #67.
#   0.11.0 Memória de conversa (G1-10, DEC-046): G095 a G099, follow-ups dos itens G005, G009, G051 e do
#          par G097 → G098, que somados ao G046 fazem os 5 do aceite. A nota do G046 deixou de dizer que a
#          memória não existe. Numerada depois da 0.10.0 do PR #84 (Dados); o conflito de versão e de
#          cabeçalho com o #84 é esperado e se resolve mantendo os dois históricos.
versao: 0.11.0
status: rascunho

