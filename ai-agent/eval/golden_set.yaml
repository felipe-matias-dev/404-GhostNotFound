    expected_status: answered
    datasets: [amostra, gold_real]
    follow_up_of: null
    notes: "Agrupa pelas quatro classes do contrato (B1, B2, B3, A4). Conferência de Dados (29/10/2026): a referência foi executada na amostra e na Gold real pelo caminho do agente (validador e executor) e volta com resultado nas duas bases; responde à pergunta com o mesmo período, recorte e medida. A mesma pergunta está nos exemplos few-shot da camada, o que mede memória (comentário na issue #90). Revisado por Dados. Mudança na 0.15.0 (GenAI, 30/10/2026, issue #90 item 1): a pergunta era igual a um exemplo few-shot da camada, o que media memória; a pergunta foi reescrita e a referência não muda. Conferido por Dados no PR #97 (Alisson Ramos, 30/10/2026)."
    revisado_por: "Alisson Ramos"

  - id: G004
    question: "Quantas UCs têm painel solar?"
