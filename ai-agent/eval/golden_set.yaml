    notes: "Top-N com LIMIT pedido pelo usuário: não é truncamento. Conferência de Dados (29/10/2026): a referência foi executada na amostra e na Gold real pelo caminho do agente (validador e executor) e volta com resultado nas duas bases; responde à pergunta com o mesmo período, recorte e medida. Não há empate na quinta posição na Gold real. Revisado por Dados."
    revisado_por: "Alisson Ramos"

  - id: G008
    question: "Qual é o consumo médio mensal das UCs residenciais nos últimos 12 meses?"
    category: simples
    reference_sql: "SELECT round(avg(consumo_medio_kwh_12m), 2) AS consumo_medio FROM sem_uc WHERE classe = 'B1'"
    expected_status: answered
    datasets: [amostra, gold_real]
    follow_up_of: null
    notes: "Residencial é B1 (glossário). A média é calculada pelo banco. Mudança na 0.13.0 (Dados, 29/10/2026): a pergunta dizia 'consumo médio anual', mas consumo_medio_kwh_12m é a média mensal dos últimos 12 meses (kWh/mês no contrato), e a referência devolvia cerca de um doze avos do que a pergunta pedia. A pergunta passa a pedir o consumo médio mensal, e a referência arredonda para 2 casas. Conferência de Dados (29/10/2026): a referência foi executada na amostra e na Gold real pelo caminho do agente (validador e executor) e volta com resultado nas duas bases. Na Gold real, B1 é exatamente classe_cadastro Residencial, B2 é Rural e A4 é Industrial, então classe e classe_cadastro dão o mesmo número. Revisado por Dados."
    revisado_por: "Alisson Ramos"

  - id: G009
    question: "Qual foi o DEC do alimentador AL-07 em maio de 2024?"
    category: simples
    reference_sql: "SELECT round(dec::numeric, 2) AS dec FROM sem_continuidade_alimentador_mensal WHERE cod_alimentador = 'AL-07' AND competencia = '2024-05'"
    expected_status: answered
    datasets: [amostra]
    follow_up_of: null
    notes: "DEC é lido da Gold, nunca recalculado. Mudança na 0.13.0 (Dados, 29/10/2026): a leitura do dec passa a `round(dec::numeric, 2)`. Na versão anterior, uma resposta certa com 2 casas falhava na comparação (results_match arredonda a resposta para as casas da referência, até 6). O `::numeric` é necessário porque a coluna é `double precision`. Conferência de Dados (29/10/2026): a referência foi executada na amostra pelo caminho do agente (validador e executor) e volta com resultado; na Gold real o código não existe. Revisado por Dados. Mudança na 0.16.0 (Dados, 30/10/2026): o mês passa de março para maio de 2024. Em março, o AL-07 da amostra não tem interrupção e a referência devolvia DEC zero, o mesmo valor de uma resposta errada; em maio o DEC é diferente de zero. O G100, follow-up deste item, acompanha a troca. Conferência de Dados (30/10/2026): a referência nova foi executada na amostra e volta com DEC diferente de zero."
    revisado_por: "Alisson Ramos"

  # --- junção: duas views ligadas por chave ---

  - id: G010
    question: "Qual o DEC em 2025 do conjunto de alimentadores que atendem UCs com painel solar?"
    category: juncao
    reference_sql: "SELECT round((sum(c.horas_interrompidas) / NULLIF(sum(c.n_uc) / 12.0, 0))::numeric, 2) AS dec_grupo FROM sem_continuidade_alimentador_mensal c WHERE c.competencia LIKE '2025-%' AND c.cod_alimentador IN (SELECT u.cod_alimentador FROM sem_uc u WHERE u.possui_gd)"
    expected_status: answered
    datasets: [amostra, gold_real]
    follow_up_of: null
    notes: "Liga UC a alimentador por sem_uc.cod_alimentador = sem_continuidade_alimentador_mensal.cod_alimentador. Revisão de Dados (27/10/2026): O DEC do conjunto de alimentadores é o DEC do grupo, com as horas somadas antes de dividir e as UCs pela média mensal, dividindo por 12 (os meses do período pedido, e não os que aparecem no resultado; DEC-032 e a regra de recortes: nunca média de índices). O `::numeric` é necessário porque `horas_interrompidas` é `double precision` e o Postgres não tem `round(double precision, integer)`. A referência fazia a média dos DEC mensais, que dá cerca de um doze avos do DEC do ano. Na Gold real quase todos os alimentadores atendem alguma UC com painel solar, então o filtro quase não filtra; na amostra, filtra. Pendente de revisão por Dados. Conferência de Dados (29/10/2026): a referência foi executada na amostra e na Gold real pelo caminho do agente (validador e executor) e volta com resultado nas duas bases; responde à pergunta com o mesmo período, recorte e medida. Na Gold real, o possui_gd do cadastro e a GD conectada até 2025 dão o mesmo conjunto de alimentadores e o mesmo DEC, então a dúvida do G014 não muda este item. Revisado por Dados."
    revisado_por: "Alisson Ramos"

  - id: G011
    question: "Qual o FEC de março de 2025 do alimentador onde fica a UC 0003?"
    category: juncao
    reference_sql: "SELECT round(c.fec::numeric, 2) AS fec FROM sem_uc u JOIN sem_continuidade_alimentador_mensal c ON c.cod_alimentador = u.cod_alimentador WHERE u.cod_uc = '0003' AND c.competencia = '2025-03'"
    expected_status: answered
    datasets: [amostra]
    follow_up_of: null
    notes: "Encadeia UC, alimentador e FEC. Mudança na 0.13.0 (Dados, 29/10/2026): a leitura do fec passa a `round(c.fec::numeric, 2)`. Na versão anterior, uma resposta certa com 2 casas falhava na comparação (results_match arredonda a resposta para as casas da referência, até 6). O `::numeric` é necessário porque a coluna é `double precision`. Conferência de Dados (29/10/2026): a referência foi executada na amostra pelo caminho do agente (validador e executor) e volta com resultado; na Gold real o código não existe. Revisado por Dados."
    revisado_por: "Alisson Ramos"

