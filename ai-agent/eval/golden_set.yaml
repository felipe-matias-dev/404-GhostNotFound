    follow_up_of: null
    notes: "Contagem simples. Conferência de Dados (29/10/2026): a referência foi executada na amostra e na Gold real pelo caminho do agente (validador e executor) e volta com resultado nas duas bases; responde à pergunta com o mesmo período, recorte e medida. Revisado por Dados."
    revisado_por: "Alisson Ramos"

