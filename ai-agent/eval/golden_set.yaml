  - id: G041
    question: "A tarifa média residencial subiu entre o primeiro ano da base e os últimos 12 meses?"
    category: case
    reference_sql: "WITH meses AS (SELECT competencia, row_number() OVER (ORDER BY competencia) AS ordem_inicio, row_number() OVER (ORDER BY competencia DESC) AS ordem_fim FROM (SELECT DISTINCT competencia FROM sem_faturamento_mensal) c) SELECT round(sum(CASE WHEN m.ordem_inicio <= 12 THEN f.receita_energia END) / NULLIF(sum(CASE WHEN m.ordem_inicio <= 12 THEN f.kwh_faturado END), 0), 2) AS tarifa_primeiro_ano, round(sum(CASE WHEN m.ordem_fim <= 12 THEN f.receita_energia END) / NULLIF(sum(CASE WHEN m.ordem_fim <= 12 THEN f.kwh_faturado END), 0), 2) AS tarifa_ultimos_12_meses FROM sem_faturamento_mensal f JOIN meses m ON m.competencia = f.competencia JOIN sem_uc u ON u.cod_uc = f.cod_uc WHERE u.classe = 'B1'"
    expected_status: answered
    datasets: [amostra, gold_real]
