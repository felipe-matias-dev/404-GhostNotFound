- id: I029
  question: Me traz o valor faturado, o montante que ficou em atraso e o total de chamados sobre cobrança no município de
    Paulista em novembro de 2025.
  category: inedita
  papel: analista de cobrança
  reference_sql: WITH f AS (SELECT sum(receita_faturada) AS receita_faturada, sum(valor_nao_pago) AS valor_nao_pago FROM sem_kpis_segmento_mensal
    WHERE municipio = 'Paulista' AND competencia = '2025-11'), c AS (SELECT count(*) AS chamados_fatura FROM sem_atendimentos_uc
    a JOIN sem_uc u ON u.cod_uc = a.cod_uc WHERE u.municipio = 'Paulista' AND a.assunto = 'FATURA' AND a.competencia = '2025-11')
    SELECT f.receita_faturada, f.valor_nao_pago, c.chamados_fatura FROM f, c
  parts:
  - - receita_faturada
  - - valor_nao_pago
  - - chamados_fatura
  expected_status: answered
  datasets:
  - gold_real
  follow_up_of: null
  revisado_por: null
