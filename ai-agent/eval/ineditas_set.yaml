  revisado_por: null
- id: I109
  question: Qual era a nota média de satisfação do atendimento presencial lá em Paulista no trimestre de abril a junho de
    2024?
  category: inedita
  papel: gerente de atendimento
  reference_sql: SELECT round(CAST(avg(a.nota_satisfacao) AS numeric), 2) AS satisfacao_media FROM sem_atendimentos_uc a JOIN
    sem_uc u ON u.cod_uc = a.cod_uc WHERE u.municipio = 'Paulista' AND a.canal = 'PRESENCIAL' AND a.competencia BETWEEN '2024-04'
    AND '2024-06'
  expected_status: answered
  datasets:
