- id: I002
  question: Compara pra mim o total de energia faturada na alta tensão A4 em Jaboatão entre junho de 2023 e junho de 2025.
  category: inedita
  papel: diretora-presidente
  reference_sql: SELECT sum(CASE WHEN competencia = '2023-06' THEN kwh_faturado END) AS kwh_2023_06, sum(CASE WHEN competencia
    = '2025-06' THEN kwh_faturado END) AS kwh_2025_06 FROM sem_kpis_segmento_mensal WHERE classe = 'A4' AND municipio = 'Jaboatão
    dos Guararapes'
  parts:
  - - kwh_2023_06
  - - kwh_2025_06
  expected_status: answered
  datasets:
  - gold_real
