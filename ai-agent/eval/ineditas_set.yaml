- id: I003
  question: Quais foram os cinco bairros do Recife que tiveram mais chamados no call center por falta de energia em novembro
    de 2025?
  category: inedita
  papel: diretora-presidente
  reference_sql: SELECT u.bairro, count(*) AS chamados FROM sem_atendimentos_uc a JOIN sem_uc u ON u.cod_uc = a.cod_uc WHERE
    u.municipio = 'Recife' AND a.assunto = 'FALTA DE ENERGIA' AND a.competencia = '2025-11' GROUP BY u.bairro ORDER BY count(*)
    DESC LIMIT 5
  parts:
  - - bairro
  - - chamados
  expected_status: answered
  datasets:
  - gold_real
  follow_up_of: null
  revisado_por: null
- id: I004
  question: Qual foi o percentual de leituras estimadas em relação ao total e qual a taxa de inadimplência (valor não pago)
    na classe comercial B3 em Boa Viagem em março de 2024?
  category: inedita
  papel: diretora-presidente
  reference_sql: SELECT round(100.0 * sum(n_leituras_estimadas) / NULLIF(sum(n_leituras), 0), 2) AS leituras_estimadas_pct,
    round(100.0 * sum(valor_nao_pago) / NULLIF(sum(receita_faturada), 0), 2) AS nao_pago_pct FROM sem_kpis_segmento_mensal
    WHERE classe = 'B3' AND municipio = 'Recife' AND bairro = 'Boa Viagem' AND competencia = '2024-03'
  parts:
  - - leituras_estimadas_pct
  - - nao_pago_pct
  expected_status: answered
  datasets:
  - gold_real
  follow_up_of: null
  revisado_por: null
