# Perguntas inéditas (T12.4, DEC-084), segundo conjunto: escritas por outro modelo (Gemini 3.5 Flash-Lite) no papel
# de gestores, só com a descrição dos dados, sem o glossário nem o golden. As referências foram escritas depois, sem
# mudar a pergunta; ficaram de fora as perguntas sobre dado que não existe ou sem uma leitura única.
# Não ajustar glossário, regras ou exemplos olhando para estas perguntas: uma falha só se corrige com regra geral.
versao: 0.2.0
itens:
- id: I101
  question: Bom dia, pessoal. Queria saber qual foi o faturamento total da distribuidora somando Recife e Olinda no acumulado
    de 2024.
  category: inedita
  papel: diretora-presidente
  reference_sql: SELECT sum(receita_faturada) AS receita_faturada FROM sem_kpis_segmento_mensal WHERE municipio IN ('Recife',
    'Olinda') AND competencia BETWEEN '2024-01' AND '2024-12'
  expected_status: answered
  datasets:
  - gold_real
  follow_up_of: null
  revisado_por: null
- id: I103
  question: Me traz o tempo médio que duraram as quedas de energia no bairro de Boa Viagem em março de 2025, por favor.
  category: inedita
  papel: gerente de operação
  reference_sql: SELECT round(CAST(avg(i.duracao_horas) AS numeric), 2) AS duracao_media_horas FROM sem_interrupcoes_uc i
    JOIN sem_uc u ON u.cod_uc = i.cod_uc WHERE u.municipio = 'Recife' AND u.bairro = 'Boa Viagem' AND i.competencia = '2025-03'
  expected_status: answered
  datasets:
  - gold_real
  follow_up_of: null
  revisado_por: null
- id: I104
  question: Qual foi o canal que mais recebeu reclamação sobre valor da conta em Paulista no mês de janeiro de 2024?
  category: inedita
  papel: gerente de atendimento
  reference_sql: SELECT a.canal, count(*) AS chamados FROM sem_atendimentos_uc a JOIN sem_uc u ON u.cod_uc = a.cod_uc WHERE
    u.municipio = 'Paulista' AND a.assunto = 'FATURA' AND a.competencia = '2024-01' GROUP BY a.canal ORDER BY count(*) DESC
    LIMIT 1
  parts:
  - - canal
  - - chamados
  expected_status: answered
  datasets:
  - gold_real
  follow_up_of: null
  revisado_por: null
- id: I105
  question: Quanto a gente deixou de arrecadar com contas em aberto no segmento industrial em Pernambuco, especificamente
    na nossa área de concessão, em dezembro de 2024?
  category: inedita
  papel: analista financeiro
  reference_sql: SELECT sum(valor_nao_pago) AS valor_nao_pago FROM sem_kpis_segmento_mensal WHERE classe_cadastro = 'Industrial'
    AND competencia = '2024-12'
  expected_status: answered
  datasets:
  - gold_real
  follow_up_of: null
  revisado_por: null
- id: I108
  question: Quantas leituras por estimativa os leituristas fizeram em Olinda no mês de fevereiro de 2025? Quero o total por
