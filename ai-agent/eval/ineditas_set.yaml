- id: I120
  question: Qual o percentual de inadimplência (contas em aberto) do segmento residencial em Recife no fechamento de dezembro
    de 2023?
  category: inedita
  papel: analista financeiro
  reference_sql: SELECT round(100.0 * sum(valor_nao_pago) / NULLIF(sum(receita_faturada), 0), 2) AS nao_pago_pct FROM sem_kpis_segmento_mensal
    WHERE classe = 'B1' AND municipio = 'Recife' AND competencia = '2023-12'
