# Camada semântica do agente Text-to-SQL (dono: GenAI).
#
# É a ACL do agente sobre a Gold: escolhe quais tabelas viram views sem_* e quais colunas
# o agente enxerga. Cada view é validada contra contracts/gold_schema.yaml na carga: tabela e
# coluna precisam existir, coluna a_confirmar não entra, e a chave primária da tabela precisa
# estar confirmada ou proposta e aparecer na view. Erro aqui falha na subida do processo.
#
# Tipos, valores permitidos (allowed) e relações vêm do contrato. As relações são montadas a
# partir das foreign_keys e das chaves compartilhadas que identificam entidade (cod_uc,
# cod_alimentador). Competência, município e bairro não viram relação: juntar só por período
# gera produto cartesiano.
#
# As linhas de exemplo são sintéticas, escritas à mão. Nenhum valor real da Gold entra aqui.
# Depois de cada mudança, gere o views.sql (ver a seção Camada semântica em ai-agent/README.md).

version: "0.3.5"

views:
  - name: sem_uc
    source: gold_dim_uc
    description: "Unidades consumidoras: cadastro com localização, classe, alimentador e geração própria"
    grain: "uma linha por unidade consumidora (UC)"
    columns:
      - name: cod_uc
        description: "código da UC; é um identificador de texto, não um número"
      - name: municipio
        description: "município onde fica a UC"
      - name: bairro
        description: "bairro onde fica a UC; o mesmo nome pode existir em municípios diferentes"
      - name: classe
        description: "classe de consumo: B1 residencial, B2 rural, B3 comercial e poder público, A4 industrial"
      - name: classe_cadastro
        description: "classe da UC no cadastro comercial; é a única coluna que separa Comercial de Poder Público, que dividem o B3"
      - name: cod_alimentador
        description: "alimentador de média tensão que atende a UC"
      - name: possui_gd
        description: "verdadeiro quando a UC tem geração própria (painel solar)"
      - name: consumo_medio_kwh_12m
        unit: "kWh"
        description: "consumo médio da UC nos últimos 12 meses, em kWh; vazio quando a UC não tem nenhuma leitura"
    sample_rows:
      - {cod_uc: "0001", municipio: "Município Exemplo A", bairro: "Bairro exemplo 1", classe: "B1", classe_cadastro: "Residencial", cod_alimentador: "AL-01", possui_gd: false, consumo_medio_kwh_12m: 250.5}
      - {cod_uc: "0002", municipio: "Município Exemplo B", bairro: "Bairro exemplo 2", classe: "A4", classe_cadastro: "Industrial", cod_alimentador: "AL-02", possui_gd: true, consumo_medio_kwh_12m: 18000.0}

  - name: sem_faturamento_mensal
    source: gold_fato_faturamento_mensal
    description: "Faturamento por UC e competência: energia, receita, tarifa e bandeira"
    grain: "uma linha por UC e competência"
    columns:
      - name: cod_uc
        description: "código da UC faturada"
      - name: competencia
        description: "mês de referência da fatura, no formato AAAA-MM (não é o mês de pagamento)"
      - name: kwh_faturado
        unit: "kWh"
        description: "energia cobrada na fatura, já líquida de geração distribuída"
      - name: receita_faturada
        unit: "R$"
        description: "valor total emitido na fatura da competência (energia e tributos); é a receita quando a pergunta não qualifica (DEC-022)"
      - name: receita_energia
        unit: "R$"
        description: "valor da energia na fatura, sem tributos; base da tarifa média"
      - name: tributos
        unit: "R$"
        description: "tributos cobrados na fatura"
      - name: receita_arrecadada
        unit: "R$"
        description: "valor efetivamente pago da fatura"
      - name: tarifa_media
        unit: "R$/kWh"
        description: "tarifa de uma UC numa competência: receita de energia dividida pela energia faturada, sem tributos; vazia quando a energia é zero. Não some nem faça média desta coluna entre UCs ou meses"
      - name: bandeira
        description: "bandeira tarifária da competência"
    sample_rows:
      - {cod_uc: "0001", competencia: "2025-03", kwh_faturado: 230.0, receita_faturada: 180.4, receita_energia: 160.0, tributos: 20.4, receita_arrecadada: 180.4, tarifa_media: 0.70, bandeira: "verde"}
      - {cod_uc: "0002", competencia: "2025-03", kwh_faturado: 0.0, receita_faturada: 0.0, receita_energia: 0.0, tributos: 0.0, receita_arrecadada: 0.0, tarifa_media: null, bandeira: "amarela"}

  - name: sem_continuidade_alimentador_mensal
    source: gold_continuidade_alimentador_mensal
    description: "Continuidade do serviço por alimentador e competência: DEC, FEC e horas interrompidas"
    grain: "uma linha por alimentador e competência"
    columns:
      - name: cod_alimentador
        description: "alimentador de média tensão"
      - name: competencia
        description: "mês de referência, no formato AAAA-MM"
      - name: dec
        description: "duração equivalente de interrupção por UC (DEC), já calculada na Gold; não recalcule"
      - name: fec
        description: "frequência equivalente de interrupção por UC (FEC), já calculada na Gold; não recalcule"
      - name: n_uc
        description: "número de UCs atendidas pelo alimentador na competência"
      - name: n_interrupcoes
        description: "número de interrupções do alimentador na competência"
      - name: horas_interrompidas
        unit: "h"
        description: "horas em que o alimentador ficou interrompido na competência"
    sample_rows:
      - {cod_alimentador: "AL-01", competencia: "2025-03", dec: 1.2, fec: 0.4, n_uc: 1500, n_interrupcoes: 3, horas_interrompidas: 2.5}
      - {cod_alimentador: "AL-02", competencia: "2025-03", dec: 0.0, fec: 0.0, n_uc: 800, n_interrupcoes: 0, horas_interrompidas: 0.0}

  - name: sem_kpis_mensais
    source: gold_kpis_mensais
    description: "Indicadores da empresa inteira por competência: energia, receita, DEC, FEC, chamados e satisfação"
    grain: "uma linha por competência"
    columns:
      - name: competencia
        description: "mês de referência, no formato AAAA-MM"
      - name: kwh_faturado
        unit: "kWh"
        description: "energia faturada no mês, somando todas as UCs"
      - name: receita_faturada
        unit: "R$"
        description: "receita faturada no mês (energia e tributos), somando todas as UCs"
      - name: receita_energia
        unit: "R$"
        description: "receita de energia no mês, sem tributos"
      - name: dec
        unit: "h"
        description: "DEC da empresa no mês, já calculado na Gold; não recalcule"
      - name: fec
        unit: "interrupções"
        description: "FEC da empresa no mês, já calculado na Gold; não recalcule"
      - name: n_chamados
        unit: "contagem"
        description: "chamados de atendimento abertos no mês; vazio quando não há atendimento carregado"
      - name: satisfacao_media
        unit: "nota"
        description: "nota média de satisfação, de 1 a 5, dos chamados abertos no mês que receberam nota"
    sample_rows:
      - {competencia: "2025-03", kwh_faturado: 1250000.0, receita_faturada: 980000.0, receita_energia: 860000.0, dec: 1.1, fec: 0.6, n_chamados: 420, satisfacao_media: 3.8}
      - {competencia: "2025-04", kwh_faturado: 1190000.0, receita_faturada: 940000.0, receita_energia: 825000.0, dec: null, fec: null, n_chamados: null, satisfacao_media: null}

  - name: sem_kpis_segmento_mensal
    source: gold_kpis_segmento_mensal
    description: "Componentes somáveis dos indicadores por competência, município, bairro, classe e geração própria"
    grain: "uma linha por competência, município, bairro, classe do cadastro e possui_gd"
    columns:
      - name: competencia
        description: "mês de referência, no formato AAAA-MM"
      - name: municipio
        description: "município do recorte"
      - name: bairro
        description: "bairro do recorte; o mesmo nome pode existir em municípios diferentes, então filtre sempre junto com o município"
      - name: classe_cadastro
        description: "classe da UC no cadastro comercial"
      - name: classe
        description: "classe de consumo: B1, B2, B3 ou A4"
      - name: cod_alimentador
        description: "alimentador que atende as UCs do recorte (do cadastro da UC)"
      - name: tipo_medidor
        description: "tipo do medidor vigente na UC na competência; sem_medidor quando a UC não tem medidor instalado no mês"
      - name: possui_gd
        description: "verdadeiro quando as UCs do recorte já tinham geração própria conectada naquela competência"
      - name: n_uc
        unit: "contagem"
        description: "UCs do recorte na competência; é um estoque, some só dentro do mesmo mês"
      - name: kwh_faturado
        unit: "kWh"
        description: "energia faturada no recorte"
      - name: receita_faturada
        unit: "R$"
        description: "receita faturada no recorte (energia e tributos)"
      - name: receita_energia
        unit: "R$"
        description: "receita de energia no recorte, sem tributos"
      - name: tributos
        unit: "R$"
        description: "tributos no recorte"
      - name: receita_arrecadada
        unit: "R$"
        description: "valor efetivamente pago no recorte; vazio quando o recorte não tem fatura na competência"
      - name: horas_interrompidas
        unit: "UC·h"
        description: "soma das horas de interrupção das UCs do recorte; componente do DEC"
      - name: n_interrupcoes
        unit: "contagem"
        description: "número de interrupções das UCs do recorte; componente do FEC"
      - name: n_chamados
        unit: "contagem"
        description: "chamados de atendimento abertos no mês pelas UCs do recorte"
      - name: soma_notas
        unit: "nota"
        description: "soma das notas de satisfação dos chamados avaliados; componente da satisfação média; vazio quando o recorte não tem chamado avaliado"
      - name: n_notas
        unit: "contagem"
        description: "chamados que receberam nota de satisfação; componente da satisfação média"
    sample_rows:
      - {competencia: "2025-03", municipio: "Município Exemplo A", bairro: "Bairro exemplo 1", classe_cadastro: "Residencial", classe: "B1", cod_alimentador: "AL-01", tipo_medidor: "smart", possui_gd: false, n_uc: 1200, kwh_faturado: 300000.0, receita_faturada: 240000.0, receita_energia: 210000.0, tributos: 30000.0, receita_arrecadada: 228000.0, horas_interrompidas: 1800.0, n_interrupcoes: 950, n_chamados: 85, soma_notas: 280.0, n_notas: 70}
      - {competencia: "2025-03", municipio: "Município Exemplo A", bairro: "Bairro exemplo 1", classe_cadastro: "Poder Público", classe: "B3", cod_alimentador: "AL-02", tipo_medidor: "sem_medidor", possui_gd: true, n_uc: 4, kwh_faturado: 0.0, receita_faturada: 0.0, receita_energia: 0.0, tributos: 0.0, receita_arrecadada: null, horas_interrompidas: 0.0, n_interrupcoes: 0, n_chamados: 0, soma_notas: null, n_notas: 0}

  - name: sem_receita_decomposicao
    source: gold_receita_decomposicao
    description: "Decomposição da variação da receita de energia entre dois períodos em efeitos de preço (tarifa e bandeira), volume e mix"
    grain: "uma linha por par de períodos, município, bairro, classe e possui_gd"
    columns:
      - name: periodo_base
        description: "faixa de meses do período inicial, no formato AAAA-MM/AAAA-MM (ex.: 2024-01/2024-12)"
      - name: periodo_atual
        description: "faixa de meses do período comparado, no formato AAAA-MM/AAAA-MM"
      - name: municipio
        description: "município do recorte"
      - name: bairro
        description: "bairro do recorte; filtre sempre junto com o município"
      - name: classe
        description: "classe de consumo: B1, B2, B3 ou A4"
      - name: possui_gd
        description: "verdadeiro quando as UCs do recorte tinham geração própria no último mês do período atual; o grupo vale para a UC nos dois períodos, então quem conectou a GD entre eles fica no grupo com GD dos dois lados (PR #42); o efeito GD é o efeito_volume dessas linhas"
      - name: receita_base
        unit: "R$"
        description: "receita de energia, sem tributos, no período base"
      - name: receita_atual
        unit: "R$"
        description: "receita de energia, sem tributos, no período atual"
      - name: efeito_preco
        unit: "R$"
        description: "parte da variação explicada pela mudança de preço; é efeito_tarifa + efeito_bandeira"
      - name: efeito_tarifa
        unit: "R$"
        description: "parte do efeito preço explicada pelo reajuste da tarifa base"
      - name: efeito_bandeira
        unit: "R$"
        description: "parte do efeito preço explicada pelo acréscimo das bandeiras amarela e vermelha"
      - name: efeito_volume
        unit: "R$"
        description: "parte da variação explicada pela mudança da energia faturada"
      - name: efeito_mix
        unit: "R$"
        description: "parte da variação explicada pela mudança de peso entre as classes"
    sample_rows:
      - {periodo_base: "2024-01/2024-12", periodo_atual: "2025-01/2025-12", municipio: "Município Exemplo A", bairro: "Bairro exemplo 1", classe: "B1", possui_gd: false, receita_base: 1000.0, receita_atual: 1100.0, efeito_preco: 80.0, efeito_tarifa: 60.0, efeito_bandeira: 20.0, efeito_volume: 30.0, efeito_mix: -10.0}
      - {periodo_base: "2024-01/2024-12", periodo_atual: "2025-01/2025-12", municipio: "Município Exemplo A", bairro: "Bairro exemplo 1", classe: "B1", possui_gd: true, receita_base: 500.0, receita_atual: 420.0, efeito_preco: 40.0, efeito_tarifa: 30.0, efeito_bandeira: 10.0, efeito_volume: -115.0, efeito_mix: -5.0}

glossary:
  - term: "conta de luz"
    synonyms: ["conta", "fatura", "cobrança"]
    maps_to: "receita_faturada em sem_faturamento_mensal"
  - term: "energia faturada"
    synonyms: ["energia cobrada", "kWh faturados"]
    maps_to: "kwh_faturado"
  - term: "falta de luz"
    synonyms: ["apagão", "queda de energia", "interrupção"]
    maps_to: "horas_interrompidas, n_interrupcoes, dec e fec"
  - term: "painel solar"
    synonyms: ["energia solar", "geração distribuída", "GD"]
    maps_to: "possui_gd"
  - term: "chamado"
    synonyms: ["atendimento", "reclamação", "ligação para o call center"]
    maps_to: "n_chamados em sem_kpis_mensais ou sem_kpis_segmento_mensal"
  - term: "satisfação"
    synonyms: ["nota do atendimento", "avaliação do atendimento"]
    maps_to: "satisfacao_media em sem_kpis_mensais; soma_notas e n_notas em sem_kpis_segmento_mensal"
  - term: "efeito preço"
    synonyms: ["reajuste", "aumento de tarifa"]
    maps_to: "efeito_preco (efeito_tarifa + efeito_bandeira) em sem_receita_decomposicao"
  - term: "efeito GD"
    synonyms: ["impacto da geração distribuída", "impacto do solar"]
    maps_to: "efeito_volume das linhas com possui_gd = true em sem_receita_decomposicao"
  - term: "residencial"
    synonyms: ["residência", "casa"]
    maps_to: "classe = 'B1'"
  - term: "rural"
    synonyms: ["zona rural"]
    maps_to: "classe = 'B2'"
  - term: "comercial"
    synonyms: ["comércio"]
    maps_to: "classe_cadastro = 'Comercial' (o B3 junta comercial e poder público)"
  - term: "poder público"
    synonyms: ["órgão público", "prefeitura"]
    maps_to: "classe_cadastro = 'Poder Público'"
  - term: "industrial"
    synonyms: ["indústria"]
    maps_to: "classe = 'A4'"

rules:
  - text: "Quando a pergunta fala de receita sem dizer qual, use receita_faturada (energia e tributos) e declare essa suposição. Em pergunta que não envolve receita, não declare suposição sobre receita."
  - text: "Receita por classe do cadastro (comercial, poder público, residencial, rural, industrial) sai de sem_faturamento_mensal ligada a sem_uc por cod_uc, filtrando sem_uc.classe_cadastro. sem_receita_decomposicao não tem classe_cadastro: não a use para separar comercial de poder público, e não troque classe_cadastro por classe."
  - text: "Variação por UC entre dois períodos (quantas UCs subiram ou caíram mais de X%): calcule a média mensal de cada UC em cada período, numa CTE por período, junte por cod_uc e conte as UCs que passam do limite. Declare como suposição que a comparação usa a média mensal."
  - text: "Crescimento ou variação de receita entre dois períodos: devolva o total de cada período, a variação absoluta e a percentual, todas calculadas no SQL, com NULLIF no divisor."
  - text: "Tarifa média é receita_energia ÷ kwh_faturado, sem tributos. Para uma UC numa competência, leia tarifa_media pronta. Para um período, classe, bairro, município ou qualquer grupo de UCs ou de meses, a tarifa é sum(receita_energia) / NULLIF(sum(kwh_faturado), 0); nunca avg(tarifa_media), que é média de razões e dá peso igual a UCs e meses de consumo diferente."
  - text: "Energia faturada é kwh_faturado, já líquida de geração distribuída."
  - text: "Competência é texto no formato AAAA-MM. Filtre por igualdade (competencia = '2025-03') ou por intervalo de texto (competencia BETWEEN '2025-01' AND '2025-03')."
  - text: "Não suponha quais competências existem. Consulte as views; se nenhuma linha atender ao filtro, o resultado vazio é a resposta."
  - text: "classe tem exatamente os valores B1, B2, B3 e A4. classe_cadastro tem Residencial, Comercial, Industrial, Rural e Poder Público, e é a única que separa Comercial de Poder Público."
  - text: "Bairro só identifica um lugar junto com o município: filtre e agrupe sempre por municipio e bairro."
  - text: "Totais da empresa por mês (energia, receita, DEC, FEC, chamados e satisfação) vêm prontos de sem_kpis_mensais."
  - text: "DEC e FEC por alimentador vêm prontos de sem_continuidade_alimentador_mensal; da empresa, de sem_kpis_mensais. Leia; não recalcule."
  - text: "DEC e FEC de um período de vários meses (semestre, ano) são a soma dos valores mensais prontos, porque são indicadores acumulados: sum(dec) e sum(fec) sobre as competências do período. Nunca use a média (avg) dos meses (DEC-032, proposta). Por recorte de sem_kpis_segmento_mensal, use a fórmula dos componentes da regra de recortes."
  - text: "Por município, bairro, classe ou GD, use sem_kpis_segmento_mensal e some os componentes antes de dividir; nunca faça média de índices. Num mês: DEC = sum(horas_interrompidas) / sum(n_uc) e FEC = sum(n_interrupcoes) / sum(n_uc). Num período de vários meses, divida pela média mensal de UCs: sum(n_uc) dividido pelo número de meses do período pedido (3 num trimestre), e não pelos meses que aparecem no resultado. Satisfação = sum(soma_notas) / sum(n_notas), com NULLIF no divisor."
  - text: "Efeitos de preço, tarifa, bandeira, volume e mix são lidos de sem_receita_decomposicao e somados sobre o recorte; não recalcule. receita_base e receita_atual são receita de energia, sem tributos."
  - text: "Em sem_receita_decomposicao, periodo_base e periodo_atual são faixas AAAA-MM/AAAA-MM. Filtre pelo par exato de períodos. Se a pergunta não disser os dois períodos, peça esclarecimento (clarify)."
  - text: "Score de suspeita, perda não técnica, atendimento por UC, interrupções por UC e medidor não estão nas views: pergunta sobre eles é unknown."
  - text: "Para ligar uma UC ao alimentador use sem_uc.cod_alimentador = sem_continuidade_alimentador_mensal.cod_alimentador."
  - text: "Períodos relativos à base ('primeiro ano da base', 'últimos 12 meses') saem das competências que existem. Numere as competências distintas com row_number() OVER (ORDER BY competencia) para o início e OVER (ORDER BY competencia DESC) para o fim, filtre por ordem <= 12 e declare os períodos usados como suposição. Nesse caso, não peça esclarecimento. A regra vale só para essas duas expressões. 'Último ano', 'ano passado' e 'último trimestre' são ambíguos (ano civil ou 12 meses móveis): peça esclarecimento, e nunca escreva anos ou meses fixos que a pergunta não trouxe."
  - text: "Quando a pergunta compara dois períodos e não diz quais são, peça esclarecimento (clarify). Não escolha os períodos sozinho. Períodos relativos à base, como 'primeiro ano da base' e 'últimos 12 meses', contam como ditos."

examples:
  - question: "Quantas UCs existem em cada classe de consumo?"
    sql: "SELECT classe, count(*) AS total FROM sem_uc GROUP BY classe ORDER BY classe"
    expected_status: ok
  - question: "Qual foi a receita faturada em março de 2025?"
    sql: "SELECT receita_faturada FROM sem_kpis_mensais WHERE competencia = '2025-03'"
    expected_status: ok
  - question: "Quantos chamados do call center foram abertos em março de 2025?"
    sql: "SELECT n_chamados FROM sem_kpis_mensais WHERE competencia = '2025-03'"
    expected_status: ok
  - question: "Qual foi o DEC de cada município no primeiro trimestre de 2025?"
    sql: "SELECT municipio, sum(horas_interrompidas) / NULLIF(sum(n_uc) / 3.0, 0) AS dec FROM sem_kpis_segmento_mensal WHERE competencia BETWEEN '2025-01' AND '2025-03' GROUP BY municipio ORDER BY dec DESC"
    expected_status: ok
  - question: "Quanto da variação da receita entre 2024-01/2024-12 e 2025-01/2025-12 veio do efeito preço?"
    sql: "SELECT sum(efeito_preco) AS efeito_preco, sum(receita_atual - receita_base) AS variacao FROM sem_receita_decomposicao WHERE periodo_base = '2024-01/2024-12' AND periodo_atual = '2025-01/2025-12'"
    expected_status: ok
  - question: "Quanto a receita comercial de Recife cresceu entre 2023 e 2024?"
