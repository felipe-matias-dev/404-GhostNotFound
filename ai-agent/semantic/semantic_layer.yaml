# Camada semântica do agente Text-to-SQL (dono: GenAI).
#
# É a ACL do agente sobre a Gold: escolhe quais tabelas viram views sem_* e quais colunas
# o agente enxerga. Cada view é validada contra contracts/gold_schema.yaml na carga: tabela e
# coluna precisam existir, coluna a_confirmar não entra, e a chave primária da tabela precisa
# estar confirmada ou proposta e aparecer na view. Erro aqui falha na subida do processo.
#
# Tipos, valores permitidos (allowed) e relações vêm do contrato. As relações são montadas a
# partir das foreign_keys e das chaves compartilhadas que identificam entidade (cod_uc,
# cod_alimentador). Competência, município e bairro não viram relação: juntar só por período
# gera produto cartesiano.
#
# As linhas de exemplo são sintéticas, escritas à mão. Nenhum valor real da Gold entra aqui.
# Depois de cada mudança, gere o views.sql (ver a seção Camada semântica em ai-agent/README.md).

version: "0.4.0"

views:
  - name: sem_uc
    source: gold_dim_uc
    description: "Unidades consumidoras: cadastro com localização, classe, alimentador e geração própria"
    grain: "uma linha por unidade consumidora (UC)"
    columns:
      - name: cod_uc
        description: "código da UC; é um identificador de texto, não um número"
      - name: municipio
        description: "município onde fica a UC"
      - name: bairro
        description: "bairro onde fica a UC; o mesmo nome pode existir em municípios diferentes"
      - name: classe
        description: "classe de consumo: B1 residencial, B2 rural, B3 comercial e poder público, A4 industrial"
      - name: classe_cadastro
        description: "classe da UC no cadastro comercial; é a única coluna que separa Comercial de Poder Público, que dividem o B3"
      - name: cod_alimentador
        description: "alimentador de média tensão que atende a UC"
      - name: possui_gd
        description: "verdadeiro quando a UC tem geração própria (painel solar)"
      - name: consumo_medio_kwh_12m
        unit: "kWh"
        description: "consumo médio da UC nos últimos 12 meses, em kWh; vazio quando a UC não tem nenhuma leitura"
      - name: data_ligacao
        description: "data em que a UC foi ligada (cliente desde)"
      - name: data_conexao_gd
        description: "data em que a geração própria foi conectada; vazia sem GD"
      - name: modalidade_gd
        description: "modalidade da geração própria: geracao_propria_uc, autoconsumo_remoto ou geracao_compartilhada; vazia sem GD"
      - name: energia_injetada_kwh_mes
        unit: "kWh/mês"
        description: "energia média injetada na rede por mês pela geração própria; vazia sem GD"
      - name: potencia_kwp
        unit: "kWp"
        description: "potência de pico instalada da geração própria; só para UCs com GD"
    sample_rows:
      - {cod_uc: "0001", municipio: "Município Exemplo A", bairro: "Bairro exemplo 1", classe: "B1", classe_cadastro: "Residencial", cod_alimentador: "AL-01", possui_gd: false, consumo_medio_kwh_12m: 250.5, data_ligacao: "2015-06-01", data_conexao_gd: null, modalidade_gd: null, energia_injetada_kwh_mes: null, potencia_kwp: null}
      - {cod_uc: "0002", municipio: "Município Exemplo B", bairro: "Bairro exemplo 2", classe: "A4", classe_cadastro: "Industrial", cod_alimentador: "AL-02", possui_gd: true, consumo_medio_kwh_12m: 18000.0, data_ligacao: "2010-03-15", data_conexao_gd: "2023-08-01", modalidade_gd: "geracao_propria_uc", energia_injetada_kwh_mes: 900.0, potencia_kwp: 7.5}

  - name: sem_faturamento_mensal
    source: gold_fato_faturamento_mensal
    description: "Faturamento por UC e competência: energia, receita, tarifa e bandeira"
    grain: "uma linha por UC e competência"
    columns:
      - name: cod_uc
        description: "código da UC faturada"
      - name: competencia
        description: "mês de referência da fatura, no formato AAAA-MM (não é o mês de pagamento)"
      - name: kwh_faturado
        unit: "kWh"
        description: "energia cobrada na fatura, já líquida de geração distribuída"
      - name: receita_faturada
        unit: "R$"
        description: "valor total emitido na fatura da competência (energia e tributos); é a receita quando a pergunta não qualifica (DEC-022)"
      - name: receita_energia
        unit: "R$"
        description: "valor da energia na fatura, sem tributos; base da tarifa média"
      - name: tributos
        unit: "R$"
        description: "tributos cobrados na fatura"
      - name: receita_arrecadada
        unit: "R$"
        description: "valor efetivamente pago da fatura"
      - name: tarifa_media
        unit: "R$/kWh"
        description: "tarifa de uma UC numa competência: receita de energia dividida pela energia faturada, sem tributos; vazia quando a energia é zero. Não some nem faça média desta coluna entre UCs ou meses"
      - name: bandeira
        description: "bandeira tarifária da competência"
      - name: receita_bandeira
        unit: "R$"
        description: "parte da receita de energia que é acréscimo da bandeira do mês; zero na bandeira verde"
      - name: data_vencimento
        description: "data de vencimento da fatura"
      - name: data_pagamento
        description: "data em que a fatura foi paga; vazia quando não foi paga"
      - name: status_pagamento
        description: "situação da fatura: paga, paga_com_atraso, em_aberto ou em_atraso (inadimplente)"
      - name: dias_em_atraso
        unit: "dias"
        description: "dias de atraso da fatura paga com atraso ou em atraso; vazio nos demais casos"
      - name: tipo_leitura
        description: "real quando a leitura foi feita no medidor, estimada quando não foi"
      - name: tipo_medidor
        description: "tipo do medidor que fez a leitura do mês: eletromecanico, eletronico ou smart"
      - name: dias_faturados
        unit: "dias"
        description: "dias entre a leitura do mês e a anterior; explica parte da variação da conta; vazio na primeira leitura"
    sample_rows:
      - {cod_uc: "0001", competencia: "2025-03", kwh_faturado: 230.0, receita_faturada: 180.4, receita_energia: 160.0, tributos: 20.4, receita_arrecadada: 180.4, tarifa_media: 0.70, bandeira: "verde", receita_bandeira: 0.0, data_vencimento: "2025-04-10", data_pagamento: "2025-04-08", status_pagamento: "paga", dias_em_atraso: null, tipo_leitura: "real", tipo_medidor: "eletronico", dias_faturados: 31}
      - {cod_uc: "0002", competencia: "2025-03", kwh_faturado: 0.0, receita_faturada: 0.0, receita_energia: 0.0, tributos: 0.0, receita_arrecadada: 0.0, tarifa_media: null, bandeira: "amarela", receita_bandeira: 0.0, data_vencimento: "2025-04-10", data_pagamento: null, status_pagamento: "em_atraso", dias_em_atraso: 12, tipo_leitura: "estimada", tipo_medidor: "smart", dias_faturados: 30}

  - name: sem_continuidade_alimentador_mensal
    source: gold_continuidade_alimentador_mensal
    description: "Continuidade do serviço por alimentador e competência: DEC, FEC e horas interrompidas"
    grain: "uma linha por alimentador e competência"
    columns:
      - name: cod_alimentador
        description: "alimentador de média tensão"
      - name: competencia
        description: "mês de referência, no formato AAAA-MM"
      - name: dec
        description: "duração equivalente de interrupção por UC (DEC), já calculada na Gold; não recalcule"
      - name: fec
        description: "frequência equivalente de interrupção por UC (FEC), já calculada na Gold; não recalcule"
      - name: n_uc
        description: "UCs faturadas pelo alimentador na competência (denominador do DEC/FEC, como no PRODIST)"
      - name: n_interrupcoes
        description: "número de interrupções do alimentador na competência"
      - name: horas_interrompidas
        unit: "h"
        description: "horas em que o alimentador ficou interrompido na competência"
    sample_rows:
      - {cod_alimentador: "AL-01", competencia: "2025-03", dec: 1.2, fec: 0.4, n_uc: 1500, n_interrupcoes: 3, horas_interrompidas: 2.5}
      - {cod_alimentador: "AL-02", competencia: "2025-03", dec: 0.0, fec: 0.0, n_uc: 800, n_interrupcoes: 0, horas_interrompidas: 0.0}

  - name: sem_kpis_mensais
    source: gold_kpis_mensais
    description: "Indicadores da empresa inteira por competência: energia, receita, DEC, FEC, chamados e satisfação"
    grain: "uma linha por competência"
    columns:
      - name: competencia
        description: "mês de referência, no formato AAAA-MM"
      - name: kwh_faturado
        unit: "kWh"
        description: "energia faturada no mês, somando todas as UCs"
      - name: receita_faturada
        unit: "R$"
        description: "receita faturada no mês (energia e tributos), somando todas as UCs"
      - name: receita_energia
        unit: "R$"
        description: "receita de energia no mês, sem tributos"
      - name: dec
        unit: "h"
        description: "DEC da empresa no mês, já calculado na Gold; não recalcule"
      - name: fec
        unit: "interrupções"
        description: "FEC da empresa no mês, já calculado na Gold; não recalcule"
      - name: n_chamados
        unit: "contagem"
        description: "chamados de atendimento abertos no mês; vazio quando não há atendimento carregado"
      - name: satisfacao_media
        unit: "nota"
        description: "nota média de satisfação, de 1 a 5, dos chamados abertos no mês que receberam nota"
    sample_rows:
      - {competencia: "2025-03", kwh_faturado: 1250000.0, receita_faturada: 980000.0, receita_energia: 860000.0, dec: 1.1, fec: 0.6, n_chamados: 420, satisfacao_media: 3.8}
      - {competencia: "2025-04", kwh_faturado: 1190000.0, receita_faturada: 940000.0, receita_energia: 825000.0, dec: null, fec: null, n_chamados: null, satisfacao_media: null}

  - name: sem_kpis_segmento_mensal
    source: gold_kpis_segmento_mensal
    description: "Componentes somáveis dos indicadores por competência, município, bairro, classe e geração própria"
    grain: "uma linha por competência, município, bairro, classe do cadastro, possui_gd, cod_alimentador e tipo_medidor"
    standalone: true
    columns:
      - name: competencia
        description: "mês de referência, no formato AAAA-MM"
      - name: municipio
        description: "município do recorte"
      - name: bairro
        description: "bairro do recorte; o mesmo nome pode existir em municípios diferentes, então filtre sempre junto com o município"
      - name: classe_cadastro
        description: "classe da UC no cadastro comercial"
      - name: classe
        description: "classe de consumo: B1, B2, B3 ou A4"
      - name: cod_alimentador
        description: "alimentador que atende as UCs do recorte (do cadastro da UC)"
      - name: tipo_medidor
        description: "tipo do medidor vigente na UC na competência; sem_medidor quando a UC não tem medidor instalado no mês"
      - name: possui_gd
        description: "verdadeiro quando as UCs do recorte já tinham geração própria conectada naquela competência"
      - name: n_uc
        unit: "contagem"
        description: "UCs faturadas no recorte na competência (denominador do DEC/FEC, como no PRODIST); num período, use a média mensal"
      - name: kwh_faturado
        unit: "kWh"
        description: "energia faturada no recorte"
      - name: receita_faturada
        unit: "R$"
        description: "receita faturada no recorte (energia e tributos)"
      - name: receita_energia
        unit: "R$"
        description: "receita de energia no recorte, sem tributos"
      - name: tributos
        unit: "R$"
        description: "tributos no recorte"
      - name: receita_arrecadada
        unit: "R$"
        description: "valor efetivamente pago no recorte; vazio quando o recorte não tem fatura na competência"
      - name: horas_interrompidas
        unit: "UC·h"
        description: "soma das horas de interrupção das UCs do recorte; componente do DEC"
      - name: n_interrupcoes
        unit: "contagem"
        description: "número de interrupções das UCs do recorte; componente do FEC"
      - name: n_chamados
        unit: "contagem"
        description: "chamados de atendimento abertos no mês pelas UCs do recorte"
      - name: soma_notas
        unit: "nota"
        description: "soma das notas de satisfação dos chamados avaliados; componente da satisfação média; vazio quando o recorte não tem chamado avaliado"
      - name: n_notas
        unit: "contagem"
        description: "chamados que receberam nota de satisfação; componente da satisfação média"
      - name: receita_bandeira
        unit: "R$"
        description: "parte da receita de energia do recorte que é acréscimo de bandeira"
      - name: n_faturas
        unit: "contagem"
        description: "faturas emitidas para as UCs do recorte na competência"
      - name: n_faturas_nao_pagas
        unit: "contagem"
        description: "faturas da competência ainda não pagas (em aberto ou em atraso); componente da inadimplência"
      - name: valor_nao_pago
        unit: "R$"
        description: "valor das faturas da competência ainda não pagas"
      - name: n_faturas_pagas_com_atraso
        unit: "contagem"
        description: "faturas da competência pagas depois do vencimento"
      - name: soma_dias_em_atraso
        unit: "dias"
        description: "soma dos dias de atraso das faturas com atraso; componente do atraso médio"
      - name: n_leituras
        unit: "contagem"
        description: "leituras das UCs do recorte na competência"
      - name: n_leituras_estimadas
        unit: "contagem"
        description: "leituras estimadas (não feitas no medidor); componente do percentual de leitura estimada"
    sample_rows:
      - {competencia: "2025-03", municipio: "Município Exemplo A", bairro: "Bairro exemplo 1", classe_cadastro: "Residencial", classe: "B1", cod_alimentador: "AL-01", tipo_medidor: "smart", possui_gd: false, n_uc: 1200, kwh_faturado: 300000.0, receita_faturada: 240000.0, receita_energia: 210000.0, tributos: 30000.0, receita_arrecadada: 228000.0, horas_interrompidas: 1800.0, n_interrupcoes: 950, n_chamados: 85, soma_notas: 280.0, n_notas: 70, receita_bandeira: 6000.0, n_faturas: 1200, n_faturas_nao_pagas: 60, valor_nao_pago: 12000.0, n_faturas_pagas_com_atraso: 90, soma_dias_em_atraso: 1350, n_leituras: 1200, n_leituras_estimadas: 36}
      - {competencia: "2025-03", municipio: "Município Exemplo A", bairro: "Bairro exemplo 1", classe_cadastro: "Poder Público", classe: "B3", cod_alimentador: "AL-02", tipo_medidor: "sem_medidor", possui_gd: true, n_uc: 4, kwh_faturado: 0.0, receita_faturada: 0.0, receita_energia: 0.0, tributos: 0.0, receita_arrecadada: null, horas_interrompidas: 0.0, n_interrupcoes: 0, n_chamados: 0, soma_notas: null, n_notas: 0, receita_bandeira: 0.0, n_faturas: 4, n_faturas_nao_pagas: 0, valor_nao_pago: 0.0, n_faturas_pagas_com_atraso: 0, soma_dias_em_atraso: 0, n_leituras: 0, n_leituras_estimadas: 0}

  - name: sem_receita_decomposicao
    source: gold_receita_decomposicao
    description: "Decomposição da variação da receita de energia entre dois períodos em efeitos de preço (tarifa e bandeira), volume e mix"
    grain: "uma linha por par de períodos, município, bairro, classe e possui_gd"
    columns:
      - name: periodo_base
        description: "faixa de meses do período inicial, no formato AAAA-MM/AAAA-MM (ex.: 2024-01/2024-12)"
      - name: periodo_atual
        description: "faixa de meses do período comparado, no formato AAAA-MM/AAAA-MM"
      - name: municipio
        description: "município do recorte"
      - name: bairro
        description: "bairro do recorte; filtre sempre junto com o município"
      - name: classe
        description: "classe de consumo: B1, B2, B3 ou A4"
      - name: possui_gd
        description: "verdadeiro quando as UCs do recorte tinham geração própria no último mês do período atual; o grupo vale para a UC nos dois períodos, então quem conectou a GD entre eles fica no grupo com GD dos dois lados (PR #42); o efeito GD é o efeito_volume dessas linhas"
      - name: receita_base
        unit: "R$"
        description: "receita de energia, sem tributos, no período base"
      - name: receita_atual
        unit: "R$"
        description: "receita de energia, sem tributos, no período atual"
      - name: efeito_preco
        unit: "R$"
        description: "parte da variação explicada pela mudança de preço; é efeito_tarifa + efeito_bandeira"
      - name: efeito_tarifa
        unit: "R$"
        description: "parte do efeito preço explicada pelo reajuste da tarifa base"
      - name: efeito_bandeira
        unit: "R$"
        description: "parte do efeito preço explicada pelo acréscimo das bandeiras amarela e vermelha"
      - name: efeito_volume
        unit: "R$"
        description: "parte da variação explicada pela mudança da energia faturada"
      - name: efeito_mix
        unit: "R$"
        description: "parte da variação explicada pela mudança de peso entre as classes"
    sample_rows:
      - {periodo_base: "2024-01/2024-12", periodo_atual: "2025-01/2025-12", municipio: "Município Exemplo A", bairro: "Bairro exemplo 1", classe: "B1", possui_gd: false, receita_base: 1000.0, receita_atual: 1100.0, efeito_preco: 80.0, efeito_tarifa: 60.0, efeito_bandeira: 20.0, efeito_volume: 30.0, efeito_mix: -10.0}
      - {periodo_base: "2024-01/2024-12", periodo_atual: "2025-01/2025-12", municipio: "Município Exemplo A", bairro: "Bairro exemplo 1", classe: "B1", possui_gd: true, receita_base: 500.0, receita_atual: 420.0, efeito_preco: 40.0, efeito_tarifa: 30.0, efeito_bandeira: 10.0, efeito_volume: -115.0, efeito_mix: -5.0}

  - name: sem_interrupcoes_uc
    source: gold_interrupcoes_uc
    description: "Ocorrências de interrupção (falta de luz) de cada UC, uma por linha"
    grain: "uma linha por ocorrência de rede de uma UC"
    columns:
      - name: cod_ocorrencia
        description: "código da ocorrência de rede"
      - name: cod_uc
        description: "código da UC interrompida; para o alimentador, ligue a sem_uc por cod_uc"
      - name: competencia
        description: "mês de abertura da ocorrência, no formato AAAA-MM"
      - name: data_abertura
        description: "início da interrupção"
      - name: data_encerramento
        description: "fim da interrupção"
      - name: duracao_horas
        unit: "h"
        description: "duração da interrupção em horas"
      - name: tipo
        description: "tipo da ocorrência, por exemplo FALTA DE ENERGIA ou OSCILACAO"
      - name: causa
        description: "causa registrada, por exemplo CLIMATICA ou VEGETACAO; vazia quando não foi registrada"
    sample_rows:
      - {cod_ocorrencia: "OC-0001", cod_uc: "0001", competencia: "2025-03", data_abertura: "2025-03-04 14:10:00", data_encerramento: "2025-03-04 16:40:00", duracao_horas: 2.5, tipo: "FALTA DE ENERGIA", causa: "CLIMATICA"}
      - {cod_ocorrencia: "OC-0002", cod_uc: "0001", competencia: "2025-03", data_abertura: "2025-03-20 08:00:00", data_encerramento: "2025-03-20 08:30:00", duracao_horas: 0.5, tipo: "OSCILACAO", causa: null}

  - name: sem_atendimentos_uc
    source: gold_atendimentos_uc
    description: "Chamados de atendimento de cada UC, um por linha, com canal, assunto e nota"
    grain: "uma linha por chamado (protocolo)"
    columns:
      - name: protocolo
        description: "protocolo do chamado"
      - name: cod_uc
        description: "código da UC que abriu o chamado"
      - name: competencia
        description: "mês de abertura do chamado, no formato AAAA-MM"
      - name: data_abertura
        description: "abertura do chamado"
      - name: data_fechamento
        description: "fechamento do chamado"
      - name: canal
        description: "canal de entrada, por exemplo TELEFONE, APP ou WHATSAPP"
      - name: assunto
        description: "assunto do chamado, por exemplo FALTA DE ENERGIA ou FATURA"
      - name: subassunto
        description: "detalhe do assunto"
      - name: nota_satisfacao
        unit: "nota"
        description: "nota de satisfação de 1 a 5; vazia quando o cliente não avaliou. A satisfação média é avg(nota_satisfacao) só sobre os avaliados"
    sample_rows:
      - {protocolo: "AT-0001", cod_uc: "0001", competencia: "2025-03", data_abertura: "2025-03-04 15:00:00", data_fechamento: "2025-03-04 15:20:00", canal: "TELEFONE", assunto: "FALTA DE ENERGIA", subassunto: "SEM ENERGIA NA RUA", nota_satisfacao: 4.0}
      - {protocolo: "AT-0002", cod_uc: "0002", competencia: "2025-03", data_abertura: "2025-03-12 10:00:00", data_fechamento: "2025-03-13 09:00:00", canal: "APP", assunto: "FATURA", subassunto: "SEGUNDA VIA", nota_satisfacao: null}

  - name: sem_medidor_uc
    source: gold_medidor_uc
    description: "Medidor vigente de cada UC: tipo, modelo, idade e trocas"
    grain: "uma linha por UC com medidor"
    columns:
      - name: cod_uc
        description: "código da UC"
      - name: cod_medidor
        description: "código do medidor vigente"
      - name: tipo_medidor
        description: "tipo do medidor vigente: eletromecanico, eletronico ou smart"
      - name: modelo
        description: "modelo do medidor vigente"
      - name: data_instalacao
        description: "instalação do medidor vigente"
      - name: idade_anos
        unit: "anos"
        description: "idade do medidor vigente no fim da última competência dos dados"
      - name: n_trocas
        unit: "contagem"
        description: "medidores já retirados da UC"
      - name: data_ultima_troca
        description: "retirada do medidor anterior; vazia se nunca houve troca"
