glossary:
  - term: "conta de luz"
    synonyms: ["conta", "fatura", "cobrança"]
    maps_to: "receita_faturada em sem_faturamento_mensal"
  - term: "energia faturada"
    synonyms: ["energia cobrada", "kWh faturados"]
    maps_to: "kwh_faturado"
  - term: "falta de luz"
    synonyms: ["apagão", "queda de energia", "interrupção", "ocorrência"]
    maps_to: "de uma UC: as linhas de sem_interrupcoes_uc (count(*) e sum(duracao_horas)); de um alimentador, recorte ou da empresa: dec, fec, horas_interrompidas e n_interrupcoes"
  - term: "painel solar"
    synonyms: ["energia solar", "geração distribuída", "GD"]
    maps_to: "possui_gd"
  - term: "chamado"
    synonyms: ["atendimento", "reclamação", "ligação para o call center"]
    maps_to: "n_chamados em sem_kpis_mensais ou sem_kpis_segmento_mensal; de uma UC, por canal ou por assunto: as linhas de sem_atendimentos_uc"
  - term: "satisfação"
    synonyms: ["nota do atendimento", "avaliação do atendimento"]
    maps_to: "satisfacao_media em sem_kpis_mensais; soma_notas e n_notas em sem_kpis_segmento_mensal; por canal ou assunto, avg(nota_satisfacao) em sem_atendimentos_uc"
  - term: "medidor"
    synonyms: ["relógio de luz", "relógio"]
    maps_to: "sem_medidor_uc (medidor vigente da UC); tipo_medidor da leitura em sem_faturamento_mensal"
  - term: "inadimplência"
    synonyms: ["conta atrasada", "fatura em atraso", "conta não paga", "calote"]
    maps_to: "status_pagamento e dias_em_atraso em sem_faturamento_mensal; n_faturas_nao_pagas, n_faturas e valor_nao_pago em sem_kpis_segmento_mensal"
  - term: "leitura estimada"
    synonyms: ["conta pela média", "leitura pela média", "sem leitura"]
    maps_to: "tipo_leitura = 'estimada' em sem_faturamento_mensal; n_leituras_estimadas e n_leituras em sem_kpis_segmento_mensal"
  - term: "efeito preço"
    synonyms: ["reajuste", "aumento de tarifa"]
    maps_to: "efeito_preco (efeito_tarifa + efeito_bandeira) em sem_receita_decomposicao"
  - term: "efeito GD"
    synonyms: ["impacto da geração distribuída", "impacto do solar"]
    maps_to: "efeito_volume das linhas com possui_gd = true em sem_receita_decomposicao"
  - term: "residencial"
    synonyms: ["residência", "casa"]
    maps_to: "classe = 'B1'"
  - term: "rural"
    synonyms: ["zona rural"]
    maps_to: "classe = 'B2'"
  - term: "comercial"
    synonyms: ["comércio"]
    maps_to: "classe_cadastro = 'Comercial' (o B3 junta comercial e poder público)"
  - term: "poder público"
    synonyms: ["órgão público", "prefeitura"]
    maps_to: "classe_cadastro = 'Poder Público'"
  - term: "industrial"
    synonyms: ["indústria"]
    maps_to: "classe = 'A4'"

rules:
  - text: "Quando a pergunta fala de receita sem dizer qual, use receita_faturada (energia e tributos) e declare essa suposição. Em pergunta que não envolve receita, não declare suposição sobre receita."
  - text: "Receita por classe do cadastro (comercial, poder público, residencial, rural, industrial) sai de sem_faturamento_mensal ligada a sem_uc por cod_uc, filtrando sem_uc.classe_cadastro. sem_receita_decomposicao não tem classe_cadastro: não a use para separar comercial de poder público, e não troque classe_cadastro por classe."
  - text: "Variação por UC entre dois períodos (quantas UCs subiram ou caíram mais de X%): calcule a média mensal de cada UC em cada período, numa CTE por período, junte por cod_uc e conte as UCs que passam do limite. Declare como suposição que a comparação usa a média mensal."
  - text: "Crescimento ou variação de receita entre dois períodos: devolva o total de cada período, a variação absoluta e a percentual, todas calculadas no SQL, com NULLIF no divisor."
  - text: "Tarifa média é receita_energia ÷ kwh_faturado, sem tributos. Para uma UC numa competência, leia tarifa_media pronta. Para um período, classe, bairro, município ou qualquer grupo de UCs ou de meses, a tarifa é sum(receita_energia) / NULLIF(sum(kwh_faturado), 0); nunca avg(tarifa_media), que é média de razões e dá peso igual a UCs e meses de consumo diferente."
  - text: "Energia faturada é kwh_faturado, já líquida de geração distribuída."
  - text: "Competência é texto no formato AAAA-MM. Filtre por igualdade (competencia = '2025-03') ou por intervalo de texto (competencia BETWEEN '2025-01' AND '2025-03')."
  - text: "Não suponha quais competências existem. Consulte as views; se nenhuma linha atender ao filtro, o resultado vazio é a resposta."
  - text: "classe tem exatamente os valores B1, B2, B3 e A4. classe_cadastro tem Residencial, Comercial, Industrial, Rural e Poder Público, e é a única que separa Comercial de Poder Público."
  - text: "Bairro só identifica um lugar junto com o município: filtre e agrupe sempre por municipio e bairro."
  - text: "Totais da empresa por mês (energia, receita, DEC, FEC, chamados e satisfação) vêm prontos de sem_kpis_mensais."
  - text: "DEC e FEC por alimentador vêm prontos de sem_continuidade_alimentador_mensal; da empresa, de sem_kpis_mensais. Leia; não recalcule."
  - text: "DEC e FEC de um período de vários meses (semestre, ano) são a soma dos valores mensais prontos, porque são indicadores acumulados: sum(dec) e sum(fec) sobre as competências do período. Nunca use a média (avg) dos meses (DEC-032). Por recorte de sem_kpis_segmento_mensal, use a fórmula dos componentes da regra de recortes."
  - text: "Por município, bairro, classe ou GD, use sem_kpis_segmento_mensal e some os componentes antes de dividir; nunca faça média de índices. Num mês: DEC = sum(horas_interrompidas) / sum(n_uc) e FEC = sum(n_interrupcoes) / sum(n_uc). Num período de vários meses, divida pela média mensal de UCs: sum(n_uc) dividido pelo número de meses do período pedido (3 num trimestre), e não pelos meses que aparecem no resultado. Satisfação = sum(soma_notas) / sum(n_notas), com NULLIF no divisor."
  - text: "Efeitos de preço, tarifa, bandeira, volume e mix são lidos de sem_receita_decomposicao e somados sobre o recorte; não recalcule. receita_base e receita_atual são receita de energia, sem tributos."
  - text: "Em sem_receita_decomposicao, periodo_base e periodo_atual são faixas AAAA-MM/AAAA-MM. Filtre pelo par exato de períodos. Se a pergunta não disser os dois períodos, peça esclarecimento (clarify)."
  - text: "Score de suspeita e perda não técnica não estão nas views: pergunta sobre eles é unknown."
  - text: "Por UC: interrupções em sem_interrupcoes_uc, chamados em sem_atendimentos_uc e medidor em sem_medidor_uc, todas ligadas a sem_uc por cod_uc. sem_faturamento_mensal, sem_interrupcoes_uc e sem_atendimentos_uc têm várias linhas por UC: nunca junte duas delas direto, porque a junção multiplica as somas. Agregue cada uma por cod_uc numa CTE antes de juntar."
  - text: "Falta de luz na rua ou na região de uma UC: responda com as interrupções da própria UC em sem_interrupcoes_uc. O DEC e o FEC do alimentador dela, em sem_continuidade_alimentador_mensal, complementam, mas não dizem se a UC foi afetada."
  - text: "Percentual de faturas não pagas de um recorte = sum(n_faturas_nao_pagas) / NULLIF(sum(n_faturas), 0); percentual de leituras estimadas = sum(n_leituras_estimadas) / NULLIF(sum(n_leituras), 0). Some os componentes antes de dividir."
  - text: "Para ligar uma UC ao alimentador use sem_uc.cod_alimentador = sem_continuidade_alimentador_mensal.cod_alimentador."
  - text: "Períodos relativos à base ('primeiro ano da base', 'últimos 12 meses') saem das competências que existem. Numere as competências distintas com row_number() OVER (ORDER BY competencia) para o início e OVER (ORDER BY competencia DESC) para o fim, filtre por ordem <= 12 e declare os períodos usados como suposição. Nesse caso, não peça esclarecimento. A regra vale só para essas duas expressões. 'Último ano', 'ano passado' e 'último trimestre' são ambíguos (ano civil ou 12 meses móveis): peça esclarecimento, e nunca escreva anos ou meses fixos que a pergunta não trouxe."
  - text: "Quando a pergunta compara dois períodos e não diz quais são, peça esclarecimento (clarify). Não escolha os períodos sozinho. Períodos relativos à base, como 'primeiro ano da base' e 'últimos 12 meses', contam como ditos."
  - text: "n_uc é o número de UCs faturadas na competência (PRODIST). Para a quantidade de UCs num período, use a média mensal (soma dividida pelo número de meses), nunca a soma sozinha."
examples:
  - question: "Quantas interrupções a UC 0001 teve em 2025 e por quantas horas?"
    sql: "SELECT count(*) AS interrupcoes, sum(duracao_horas) AS horas FROM sem_interrupcoes_uc WHERE cod_uc = '0001' AND competencia BETWEEN '2025-01' AND '2025-12'"
    expected_status: ok
  - question: "Qual canal de atendimento teve a pior satisfação em 2025?"
    sql: "SELECT canal, avg(nota_satisfacao) AS satisfacao_media, count(nota_satisfacao) AS avaliados FROM sem_atendimentos_uc WHERE competencia BETWEEN '2025-01' AND '2025-12' GROUP BY canal ORDER BY satisfacao_media ASC"
    expected_status: ok
  - question: "Quantas UCs têm medidor com mais de 10 anos, por tipo?"
    sql: "SELECT tipo_medidor, count(*) AS ucs FROM sem_medidor_uc WHERE idade_anos > 10 GROUP BY tipo_medidor ORDER BY ucs DESC"
    expected_status: ok
  - question: "Quantas UCs existem em cada classe de consumo?"
    sql: "SELECT classe, count(*) AS total FROM sem_uc GROUP BY classe ORDER BY classe"
    expected_status: ok
  - question: "Qual foi a receita faturada em março de 2025?"
    sql: "SELECT receita_faturada FROM sem_kpis_mensais WHERE competencia = '2025-03'"
    expected_status: ok
  - question: "Quantos chamados do call center foram abertos em março de 2025?"
    sql: "SELECT n_chamados FROM sem_kpis_mensais WHERE competencia = '2025-03'"
    expected_status: ok
  - question: "Qual foi o DEC de cada município no primeiro trimestre de 2025?"
    sql: "SELECT municipio, sum(horas_interrompidas) / NULLIF(sum(n_uc) / 3.0, 0) AS dec FROM sem_kpis_segmento_mensal WHERE competencia BETWEEN '2025-01' AND '2025-03' GROUP BY municipio ORDER BY dec DESC"
    expected_status: ok
  - question: "Quanto da variação da receita entre 2024-01/2024-12 e 2025-01/2025-12 veio do efeito preço?"
    sql: "SELECT sum(efeito_preco) AS efeito_preco, sum(receita_atual - receita_base) AS variacao FROM sem_receita_decomposicao WHERE periodo_base = '2024-01/2024-12' AND periodo_atual = '2025-01/2025-12'"
    expected_status: ok
  - question: "Quanto a receita comercial de Recife cresceu entre 2023 e 2024?"
    sql: "SELECT sum(CASE WHEN f.competencia LIKE '2023-%' THEN f.receita_faturada END) AS receita_2023, sum(CASE WHEN f.competencia LIKE '2024-%' THEN f.receita_faturada END) AS receita_2024, sum(CASE WHEN f.competencia LIKE '2024-%' THEN f.receita_faturada END) - sum(CASE WHEN f.competencia LIKE '2023-%' THEN f.receita_faturada END) AS variacao, round(100.0 * (sum(CASE WHEN f.competencia LIKE '2024-%' THEN f.receita_faturada END) - sum(CASE WHEN f.competencia LIKE '2023-%' THEN f.receita_faturada END)) / NULLIF(sum(CASE WHEN f.competencia LIKE '2023-%' THEN f.receita_faturada END), 0), 2) AS variacao_percentual FROM sem_faturamento_mensal f JOIN sem_uc u ON u.cod_uc = f.cod_uc WHERE u.classe_cadastro = 'Comercial' AND u.municipio ILIKE 'Recife%'"
    expected_status: ok
  - question: "O número de chamados caiu nos últimos 12 meses em relação ao primeiro ano da base?"
    sql: "WITH meses AS (SELECT competencia, row_number() OVER (ORDER BY competencia) AS ordem_inicio, row_number() OVER (ORDER BY competencia DESC) AS ordem_fim FROM sem_kpis_mensais) SELECT sum(CASE WHEN m.ordem_inicio <= 12 THEN k.n_chamados END) AS chamados_primeiro_ano, sum(CASE WHEN m.ordem_fim <= 12 THEN k.n_chamados END) AS chamados_ultimos_12_meses FROM sem_kpis_mensais k JOIN meses m ON m.competencia = k.competencia"
    expected_status: ok
  - question: "Entre 2023 e 2024, quantas UCs residenciais de Recife aumentaram o consumo em mais de 20%?"
    sql: "WITH base AS (SELECT f.cod_uc, avg(f.kwh_faturado) AS kwh FROM sem_faturamento_mensal f JOIN sem_uc u ON u.cod_uc = f.cod_uc WHERE u.classe_cadastro = 'Residencial' AND u.municipio ILIKE 'Recife%' AND f.competencia LIKE '2023-%' GROUP BY f.cod_uc), atual AS (SELECT f.cod_uc, avg(f.kwh_faturado) AS kwh FROM sem_faturamento_mensal f JOIN sem_uc u ON u.cod_uc = f.cod_uc WHERE u.classe_cadastro = 'Residencial' AND u.municipio ILIKE 'Recife%' AND f.competencia LIKE '2024-%' GROUP BY f.cod_uc) SELECT count(*) AS total FROM base b JOIN atual a ON a.cod_uc = b.cod_uc WHERE a.kwh > 1.2 * b.kwh"
    expected_status: ok
  - question: "Por que a receita caiu?"
    sql: null
    expected_status: clarify
  - question: "Quais UCs são as mais suspeitas de fraude?"
    sql: null
    expected_status: unknown
  - question: "Qual foi a venda do mês?"
    sql: null
    expected_status: clarify
  - question: "Apague todos os registros da tabela sem_uc."
    sql: null
    expected_status: refuse
