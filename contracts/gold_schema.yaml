# Contrato da camada Gold do V-Energy Grid 360 — v0.3.0 (vigente)
#
# Fonte de verdade sobre tabelas, grão, chaves, colunas e tipos. O significado e as fórmulas das
# métricas ficam em docs/dicionario-de-dados.md. Modelo de referência: docs/arquitetura.md §6.
#
# Este contrato só usa nomes e regras já documentados no repositório (docs/arquitetura.md, docs/backlog.md
# e backend/src/venergy_api/schemas.py). Nada aqui vem de observação do dataset. As decisões tomadas sobre ele
# ficam em `open_questions` (com a DEC de cada uma) e o histórico das versões em `roadmap_v0_2`.
#
# Campos de cada coluna:
#   type, nullable, allowed, pattern   estrutura (lida pelo backend: backend/tests/test_contrato_gold.py)
#   status        confirmada  já usada hoje pelo backend
#                 proposta    nome, significado, tipo e regras documentados e validados na Gold oficial
#                             (travas do notebook e QA de 27/10), sem uso direto pelo backend
#                 a_confirmar depende da Silver, do profiling ou de decisão do time
#   unit          unidade do valor (só colunas numéricas; ver conventions.units)
#   description   significado em linguagem de negócio (usado pela camada semântica do agente)
#   sensitive     true para dado pessoal ou texto livre; padrão false (ver conventions.agent)
#
# v0.2 (rascunho): consumers do agente, unit, description, sensitive, relações, decisões da daily de 21/10
# (DEC-022) e ajustes de colunas e medidas de receita (DEC-023). Mudanças que alteram nome, tipo, nulidade ou
# colunas exigem o ajuste do backend no mesmo PR (DEC-014).
#
# v0.3 (rascunho): tabelas da UC 360 com colunas e chave, gold_inspecoes_uc, componentes de faturas, leituras e
# bandeira nos recortes, alimentador e tipo de medidor na chave dos recortes (DEC-027); pares de períodos da
# decomposição (DEC-028); método do efeito bandeira (DEC-029); regras de qualidade aplicadas na Gold (DEC-030).

version: 0.3.0
status: vigente
updated: 2026-11-01

conventions:
  database: postgresql                  # DEC-002
  schema: gold                          # a Gold é somente leitura e recarregável; ordens de inspeção ficam em app.*
  table_naming: "gold_<assunto>"        # mantido no nome, conforme o planejamento e o backend
  delivery:                             # DEC-004
    format: csv
    encoding: UTF-8
    delimiter: ","
    header: true
    file_per_table: true                # gold_dim_uc.csv; cabeçalho igual aos nomes das colunas deste contrato
    boolean: ["true", "false"]
    "null": ""                          # campo vazio é nulo (entre aspas: sem elas o YAML lê null como chave nula)
    array_separator: ";"                # colunas text[] (ex.: motivos) vão numa célula só, itens separados por ;
    location: data/gold/                # fora do Git: os dados e a Gold agregada não são versionados
  invoice_status:                       # situação da fatura, calculada pela Gold contra uma data de corte
    data_corte: "maior data presente nas faturas (emissão ou pagamento), calculada a cada carga; o dado é uma extração única"
    paga: "paga até a data de vencimento"
    paga_com_atraso: "paga depois do vencimento"
    em_aberto: "não paga, com vencimento igual ou posterior à data de corte (ainda no prazo)"
    em_atraso: "não paga, com vencimento anterior à data de corte"
    note: "uma UC tem uma única fatura por competência (conferido), então a situação da fatura vive no fato, sem tabela própria. No dataset do case todas as faturas não pagas estão em atraso, porque a data de corte é posterior a todos os vencimentos; em_aberto passa a existir quando a Gold recebe dados novos"
  foreign_keys: logical                 # chaves estrangeiras são lógicas: checadas no Data Quality, sem constraint no banco,
                                        # porque o loader recarrega tabela por tabela e uma FK física faria a recarga falhar
  types:                                # tipos do contrato -> PostgreSQL
    text: text
    integer: integer
    boolean: boolean
    date: date
    timestamp: timestamp                # data e hora, sem fuso (as ocorrências e os chamados têm hora de abertura)
    money: "numeric(14,2)"              # R$; nunca float (DEC-010)
    energy_kwh: "numeric(16,3)"         # a precisão exata depende da Silver
    ratio: "double precision"
    text_array: "text[]"
  units:                                # vocabulário do campo unit
    "R$": "reais"
    "R$/kWh": "reais por quilowatt-hora"
    "kWh": "quilowatt-hora"
    "kWh/mês": "quilowatt-hora por mês"
    "kWp": "quilowatt-pico (potência de pico da geração solar)"
    "h": "horas"
    "UC·h": "consumidor × hora: soma das horas de interrupção de cada UC afetada"
    "interrupções": "número de interrupções"
    "contagem": "número de itens (UCs, chamados, interrupções)"
    "adimensional": "número sem unidade (índice)"
    "nota": "nota de satisfação do atendimento, de 1 a 5"
    "posição": "posição em um ranking (1 = primeira)"
    "dias": "dias corridos"
    "anos": "anos (idade, com fração)"
  agent:                                # regras da camada semântica do agente (views sem_*)
    tables: "só as tabelas com agente em consumers"
    columns: "só colunas com status confirmada ou proposta e sensitive diferente de true"
    contract_version: "as views registram a versão deste contrato"
    receita_sem_qualificador: receita_faturada   # DEC-022: o agente assume e declara na resposta
  personal_data: "Dado pessoal (nome e documento do titular) só entra na Gold mascarado, e a coluna mascarada leva sensitive: true. O dado original não chega às tabelas Gold."
  shared_keys:                          # Shared Kernel: mudar exige PR com um revisor de cada frente
    cod_uc:          {type: text, note: "identificador, não número: pode ter zeros à esquerda"}
    competencia:     {type: text, pattern: '^\d{4}-(0[1-9]|1[0-2])$', note: "mês de referência, YYYY-MM"}
    classe:          {type: text, allowed: [B1, B2, B3, A4]}
    cod_alimentador: {type: text}
    municipio:       {type: text, note: "conferido na Silver (log de qualidade): uma grafia por município, sem nulos"}
    bairro:          {type: text, note: "uma grafia por bairro em cada município, sem nulos, depois da correção de encoding da Silver (UC-13); sempre junto com o município"}
    tipo_medidor:    {type: text, allowed: [eletromecanico, eletronico, smart, sem_medidor], note: "sem_medidor só em gold_kpis_segmento_mensal, para a UC sem medidor instalado no mês; nas demais tabelas, os três tipos"}

# Relações que não são chave estrangeira. Alinhado à DEC-018 (GenAI, proposta): o agente só junta views por
# chave de entidade (cod_uc, cod_alimentador). Junção só por competencia ou por município/bairro gera produto
# cartesiano e fica fora até ser revisada com o GenAI.
relations:
  - {left: gold_dim_uc.cod_alimentador, right: gold_continuidade_alimentador_mensal.cod_alimentador, status: proposta, note: "UC -> alimentador que a atende"}
  - {left: "gold_receita_decomposicao.(municipio, bairro, classe, possui_gd)", right: "gold_dim_uc.(municipio, bairro, classe, possui_gd)", status: a_confirmar, note: "junção composta; revisar com o GenAI quando a decomposição entrar na camada semântica (DEC-018, em aberto)"}

tables:

  gold_dim_uc:
    description: "Dimensão de unidades consumidoras."
    grain: "1 linha por UC"
    primary_key: [cod_uc]
    context: Relacionamento
    consumers: [UC 360, agente, filtros]
    owner: Dados
    note: "Inclui as UCs de teste do cadastro (UC-12, cod_uc com prefixo TESTE), sem fatura, medidor, ocorrência, chamado nem inspeção: entram em contagens feitas direto nesta tabela, mas não em receita, energia, n_uc, DEC/FEC, recortes nem fila (DEC-067)."
    columns:
      cod_uc:                {type: text,       nullable: false, status: confirmada, description: "Código da unidade consumidora (ponto com medidor)"}
      municipio:             {type: text,       nullable: false, status: confirmada, description: "Município da UC"}
      bairro:                {type: text,       nullable: false, status: confirmada, description: "Bairro da UC"}
      classe:                {type: text,       nullable: false, status: confirmada, allowed: [B1, B2, B3, A4], description: "Classe de consumo como no case: B1 residencial, B2 rural, B3 comercial e poder público, A4 industrial MT; define a tarifa"}
      classe_cadastro:       {type: text,       nullable: false, status: proposta, allowed: [Residencial, Comercial, Industrial, Rural, Poder Público], description: "Classe da UC no cadastro comercial; separa Comercial de Poder Público, que dividem o B3", note: "opção B da DEC-023: acrescenta a coluna sem mudar classe, que backend e agente já usam"}
      cod_alimentador:       {type: text,       nullable: false, status: confirmada, description: "Alimentador (circuito de média tensão) que atende a UC"}
      possui_gd:             {type: boolean,    nullable: false, status: confirmada, description: "A UC tem geração própria (ex.: solar)"}
      consumo_medio_kwh_12m: {type: energy_kwh, nullable: true,  status: confirmada, check: ">= 0", unit: "kWh/mês", description: "Consumo médio mensal da UC nos últimos 12 meses; vazio quando a UC não tem leitura", note: "nulo, e não zero: há UCs do cadastro sem nenhuma leitura (log da Silver), e sem leitura não há média (DEC-023)"}
      titular_mascarado:     {type: text,       nullable: true,  status: proposta, sensitive: true, description: "Iniciais do titular da UC, para o atendente confirmar a identidade na UC 360", note: "o nome completo não chega à Gold; fora do agente (DEC-023)"}
      documento_mascarado:   {type: text,       nullable: true,  status: proposta, sensitive: true, description: "Documento do titular com só os 3 últimos dígitos, para o atendente confirmar a identidade", note: "o documento completo não chega à Gold; vazio nas UCs da UC-12, cujo documento é um preenchimento repetido (DEC-030); fora do agente (DEC-023)"}
      potencia_kwp:          {type: ratio,      nullable: true,  status: proposta, unit: "kWp", description: "Potência de pico instalada da geração própria; só para UCs com GD", note: "era potencia_kw: a origem só traz potência de pico (kWp), e kW seria outra grandeza (DEC-023). Os registros com potência anômala da Silver (GD-02) são convertidos de Wp para kWp quando o dado confirma (valor convertido e energia injetada por kWp na faixa das UCs normais); os que não confirmam ficam vazios (DEC-030)"}
      data_ligacao:          {type: date,       nullable: false, status: proposta, description: "Data em que a UC foi ligada (cliente desde)", note: "a UC conta no n_uc a partir da primeira competência com fatura, e não do mês da ligação (DEC-023, DEC-030)"}
      data_conexao_gd:       {type: date,       nullable: true,  status: proposta, description: "Data em que a geração própria foi conectada; vazia sem GD", note: "permite comparar o consumo da UC antes e depois da conexão (H1, UC 360)"}
      modalidade_gd:         {type: text,       nullable: true,  status: proposta, allowed: [geracao_propria_uc, autoconsumo_remoto, geracao_compartilhada], description: "Modalidade da geração própria; vazia sem GD"}
      energia_injetada_kwh_mes: {type: energy_kwh, nullable: true, status: proposta, unit: "kWh/mês", description: "Energia média injetada na rede por mês pela geração própria; vazia sem GD"}

  gold_fato_faturamento_mensal:
    description: "Faturamento por UC e competência."
    grain: "UC × competência"
    primary_key: [cod_uc, competencia]
    foreign_keys:
      - {columns: [cod_uc], references: gold_dim_uc.cod_uc}
    context: Receita
    consumers: [KPIs, tela Receita, UC 360, agente]
    owner: Dados
    columns:
      cod_uc:              {type: text,       nullable: false, status: proposta, description: "Código da unidade consumidora"}
      competencia:         {type: text,       nullable: false, status: proposta, pattern: '^\d{4}-(0[1-9]|1[0-2])$', description: "Mês de referência do consumo e da fatura (não o mês de pagamento)"}
      kwh_faturado:        {type: energy_kwh, nullable: false, status: proposta, unit: "kWh", description: "Energia cobrada na fatura, já líquida de GD", note: "regra em origem_kwh, validada contra o kWh implícito da fatura; o consumo da leitura já é líquido de GD, conferido contra a energia injetada (DEC-023)"}
      kwh_leitura:         {type: energy_kwh, nullable: false, status: proposta, unit: "kWh", description: "Consumo apurado na leitura, sem correção (consumo_kwh da Silver)", note: "pode ser negativo; guardado para rastrear a correção"}
      origem_kwh:          {type: text,       nullable: false, status: proposta, allowed: [leitura, leitura_atual_troca_medidor, consumo_absoluto], description: "Regra que gerou kwh_faturado: o próprio consumo da leitura (consumo não negativo); a leitura atual quando o consumo é negativo e há medidor instalado na competência (troca de medidor); ou o valor absoluto quando o consumo é negativo sem medidor novo (sinal invertido)"}
      receita_faturada:    {type: money,      nullable: false, status: proposta, unit: "R$", description: "Valor total emitido na fatura da competência (energia + tributos)"}
      receita_energia:     {type: money,      nullable: false, status: proposta, unit: "R$", description: "Valor da energia na fatura, sem tributos", note: "base da receita no PVM e na tarifa média (DEC-023, confirmada na DEC-066)"}
      tributos:            {type: money,      nullable: false, status: proposta, unit: "R$", description: "Tributos cobrados na fatura"}
      receita_arrecadada:  {type: money,      nullable: true,  status: proposta, unit: "R$", description: "Valor efetivamente pago"}
      tarifa_media:        {type: ratio,      nullable: true,  status: proposta, unit: "R$/kWh", description: "Receita de energia dividida pela energia faturada (sem tributos)", note: "receita_energia ÷ kwh_faturado (DEC-023, DEC-066); NULL quando kwh_faturado = 0 (ex.: GD que compensa todo o consumo)"}
      bandeira:            {type: text,       nullable: true,  status: proposta, allowed: [verde, amarela, vermelha_p1, vermelha_p2], description: "Bandeira tarifária da competência (acréscimo mensal)", note: "a Silver usa Verde, Amarela, Vermelha P1 e Vermelha P2; a Gold converte para este formato"}
      data_vencimento:     {type: date,       nullable: false, status: proposta, description: "Data de vencimento da fatura"}
      data_pagamento:      {type: date,       nullable: true,  status: proposta, description: "Data em que a fatura foi paga; vazia quando não foi paga", note: "a Silver converte o ano 9999 (código de não pago) em nulo (FAT-04)"}
      status_pagamento:    {type: text,       nullable: false, status: proposta, allowed: [paga, paga_com_atraso, em_aberto, em_atraso], description: "Situação da fatura na data de corte: paga (até o vencimento), paga com atraso, em aberto (não paga e ainda no prazo) ou em atraso (não paga e vencida)", note: "regra em conventions.invoice_status; a Silver só distingue paga, paga com atraso e em aberto"}
      dias_em_atraso:      {type: integer,    nullable: true,  status: proposta, unit: "dias", description: "Dias de atraso: da data de pagamento depois do vencimento (paga com atraso) ou da data de corte depois do vencimento (em atraso); vazio nos demais casos", note: "dá ao portal a gravidade do atraso sem precisar conhecer a data de corte"}
      receita_bandeira:    {type: money,      nullable: false, status: proposta, unit: "R$", description: "Parte da receita de energia que é acréscimo da bandeira tarifária do mês (zero na bandeira verde)", note: "kwh_faturado × acréscimo da bandeira por kWh (DEC-029); receita_energia - receita_bandeira é a receita pela tarifa base"}
      tipo_leitura:        {type: text,       nullable: false, status: proposta, allowed: [real, estimada], description: "Se a leitura do mês foi feita no medidor (real) ou estimada"}
      tipo_medidor:        {type: text,       nullable: false, status: proposta, allowed: [eletromecanico, eletronico, smart], description: "Tipo do medidor que fez a leitura do mês", note: "no mês da troca de medidor pode diferir do tipo_medidor de gold_kpis_segmento_mensal, que é o medidor vigente pelas datas: n_leituras por tipo no recorte não bate com a contagem do fato por tipo nesse mês (DEC-027)"}
      dias_faturados:      {type: integer,    nullable: true,  status: proposta, unit: "dias", description: "Dias entre a leitura do mês e a do mês anterior; vazio na primeira leitura da UC", note: "explica parte da variação da conta (insight conta alta, G2-05)"}
    checks:
      - "receita_faturada = receita_energia + tributos (por linha, diferença máxima de R$ 0,01)"
      - "0 <= receita_bandeira <= receita_energia; receita_bandeira = 0 quando a bandeira é verde"
      - "data_pagamento vazia se e somente se status_pagamento é em_aberto ou em_atraso; dias_em_atraso vazio quando a fatura foi paga até o vencimento ou está em aberto"

  gold_receita_decomposicao:
    description: "Decomposição da variação de receita entre dois períodos (PVM com efeito mix)."
    grain: "par de períodos × município × bairro × classe × possui_gd"
    primary_key: [periodo_base, periodo_atual, municipio, bairro, classe, possui_gd]
    periods: "todos os pares de 'mesmos meses em anos diferentes' com dado nos dois lados: para cada mês de início, cada duração de 1 a 12 meses e cada par de anos (ex.: 2024-01/2024-04 x 2025-01/2025-04; 2022-07/2023-06 x 2025-07/2026-06). Outros pares (trechos diferentes, ex.: jan-abr x mar-jun) não são gravados: todas as combinações passariam de 1 bilhão de linhas. Se o portal precisar deles, o backend calcula na hora com a mesma fórmula, a partir de gold_fato_faturamento_mensal e receita_bandeira (DEC-028)"
    context: Receita
    consumers: [tela Receita, insight, diagnóstico, agente]
    owner: Dados
    columns:
      periodo_base:   {type: text,  nullable: false, status: proposta, description: "Faixa de meses do período inicial da comparação", note: "texto AAAA-MM/AAAA-MM (ex.: 2022-07/2023-06), formato confirmado; a Gold grava os pares de mesmos meses em anos diferentes, e outro par, se o portal precisar, o backend calcula na hora (DEC-028)"}
      periodo_atual:  {type: text,  nullable: false, status: proposta, description: "Faixa de meses do período comparado", note: "texto AAAA-MM/AAAA-MM (ex.: 2025-07/2026-06), formato confirmado"}
      municipio:      {type: text,  nullable: false, status: proposta, description: "Município"}
      bairro:         {type: text,  nullable: false, status: proposta, description: "Bairro"}
      classe:         {type: text,  nullable: false, status: proposta, allowed: [B1, B2, B3, A4], description: "Classe de consumo (B1, B2, B3, A4)"}
      possui_gd:      {type: boolean, nullable: false, status: proposta, description: "A UC tinha geração própria conectada no último mês do período atual; o efeito GD é o efeito volume das linhas com possui_gd = true", note: "DEC-023: separa a queda de volume da GD do restante sem coluna de efeito própria. O grupo vale para a UC nos dois períodos: quem conectou a GD entre eles fica no grupo com GD de ambos os lados (DEC-023)"}
      receita_base:   {type: money, nullable: false, status: proposta, unit: "R$", description: "Receita de energia (sem tributos) no período base", note: "base: receita_energia (DEC-023, DEC-066)"}
      receita_atual:  {type: money, nullable: false, status: proposta, unit: "R$", description: "Receita de energia (sem tributos) no período atual", note: "base: receita_energia (DEC-023, DEC-066)"}
      efeito_preco:   {type: money, nullable: false, status: proposta, unit: "R$", description: "Parte da variação de receita explicada pela mudança de preço: efeito_tarifa + efeito_bandeira"}
      efeito_tarifa:  {type: money, nullable: false, status: proposta, unit: "R$", description: "Parte do efeito preço explicada pelo reajuste da tarifa base, sem a bandeira"}
      efeito_bandeira: {type: money, nullable: false, status: proposta, unit: "R$", description: "Parte do efeito preço explicada pelo acréscimo da bandeira tarifária (meses com bandeira amarela ou vermelha)", note: "método na DEC-029: a bandeira é um acréscimo fixo por kWh; efeito_tarifa usa a receita sem o acréscimo"}
      efeito_volume:  {type: money, nullable: false, status: proposta, unit: "R$", description: "Parte da variação de receita explicada pela mudança de energia faturada"}
      efeito_mix:     {type: money, nullable: false, status: proposta, unit: "R$", description: "Parte da variação de receita explicada pela mudança de peso entre classes", note: "mede o peso das classes na empresa inteira: filtrando um bairro, o efeito mix é a parte daquele bairro no mix da empresa, e não a troca de classes dentro do bairro"}
    checks:
      - "|efeito_preco - (efeito_tarifa + efeito_bandeira)| <= R$ 0,01 por linha"
      - "|efeito_preco + efeito_volume + efeito_mix - (receita_atual - receita_base)| <= R$ 0,025 por linha (só o arredondamento das quatro parcelas gravadas, tarifa, bandeira, volume e mix, cujo pior caso é R$ 0,02; DEC-014, DEC-029). O mix é calculado, não resíduo."

  gold_kpis_mensais:
    description: "Indicadores executivos por competência: total da empresa, igual à soma de gold_kpis_segmento_mensal por competência."
    grain: "1 linha por competência"
    primary_key: [competencia]
    context: [Receita, Rede, Atendimento]
    consumers: [dashboard executivo, GET /receita/mensal, agente]
    owner: Dados
    columns:
      competencia:       {type: text,       nullable: false, status: proposta, pattern: '^\d{4}-(0[1-9]|1[0-2])$', description: "Mês de referência"}
      kwh_faturado:      {type: energy_kwh, nullable: false, status: proposta, unit: "kWh", description: "Energia faturada no mês, somando todas as UCs"}
      receita_faturada:  {type: money,      nullable: false, status: proposta, unit: "R$", description: "Receita faturada no mês (energia + tributos), somando todas as UCs"}
      receita_energia:   {type: money,      nullable: false, status: proposta, unit: "R$", description: "Receita de energia no mês (sem tributos), somando todas as UCs"}
      dec:               {type: ratio,      nullable: true,  status: proposta, unit: "h", description: "DEC do mês: duração equivalente de interrupção por UC"}
      fec:               {type: ratio,      nullable: true,  status: proposta, unit: "interrupções", description: "FEC do mês: frequência equivalente de interrupção por UC"}
      n_chamados:        {type: integer,    nullable: true,  status: proposta, unit: "contagem", description: "Chamados de atendimento abertos no mês (pela data de abertura)", note: "vazio quando não há atendimento carregado no período"}
      satisfacao_media:  {type: ratio,      nullable: true,  status: proposta, unit: "nota", description: "Nota média de satisfação dos chamados abertos no mês, de 1 a 5", note: "soma das notas ÷ chamados com nota; chamados sem nota ficam fora da média (ATD-01)"}
    checks:
      - "kwh_faturado, receita_faturada e receita_energia = soma de gold_kpis_segmento_mensal na competência"

  gold_kpis_segmento_mensal:
    description: "KPIs por recorte (município, bairro, classe e geração própria) e competência, guardados como componentes somáveis. Qualquer período é a soma das competências escolhidas. O portal e o agente somam os componentes do filtro e calculam os índices no final."
    grain: "competência × município × bairro × classe_cadastro × possui_gd × alimentador × tipo de medidor"
    primary_key: [competencia, municipio, bairro, classe_cadastro, possui_gd, cod_alimentador, tipo_medidor]
    context: [Receita, Rede, Atendimento]
    consumers: [dashboard executivo, filtros da diretoria, agente]
    owner: Dados
    columns:
      competencia:         {type: text,       nullable: false, status: proposta, pattern: '^\d{4}-(0[1-9]|1[0-2])$', description: "Mês de referência"}
      municipio:           {type: text,       nullable: false, status: proposta, description: "Município"}
      bairro:              {type: text,       nullable: false, status: proposta, description: "Bairro (o mesmo nome pode existir em municípios diferentes: sempre junto com o município)"}
      classe_cadastro:     {type: text,       nullable: false, status: proposta, allowed: [Residencial, Comercial, Industrial, Rural, Poder Público], description: "Classe da UC no cadastro comercial"}
      classe:              {type: text,       nullable: false, status: proposta, allowed: [B1, B2, B3, A4], description: "Classe de consumo (B1, B2, B3, A4); determinada pela classe do cadastro"}
      possui_gd:           {type: boolean,    nullable: false, status: proposta, description: "A UC já tinha geração própria conectada na competência (data de conexão até o mês)", note: "por competência, e não o estado atual: antes da conexão a UC conta como sem GD, o que permite comparar antes e depois"}
      cod_alimentador:     {type: text,       nullable: false, status: proposta, description: "Alimentador que atende as UCs do recorte (do cadastro da UC)", note: "cada bairro é atendido por 1 ou 2 alimentadores; permite cruzar continuidade com bairro, classe e GD (DEC-027)"}
      tipo_medidor:        {type: text,       nullable: false, status: proposta, allowed: [eletromecanico, eletronico, smart, sem_medidor], description: "Tipo do medidor vigente na UC na competência; sem_medidor quando a UC não tem medidor instalado no mês", note: "vigente pela data de instalação e de retirada: muda quando o medidor é trocado (DEC-027). Não é o medidor da leitura (tipo_medidor do fato): no mês da troca os dois podem divergir"}
      n_uc:                {type: integer,    nullable: false, status: proposta, unit: "contagem", description: "UCs faturadas no recorte, na competência (denominador do DEC/FEC, como no PRODIST)", note: "é um estoque: some só dentro do mesmo mês. Para um período de vários meses, o DEC e o FEC usam a média mensal (soma de n_uc ÷ número de meses)"}
      kwh_faturado:        {type: energy_kwh, nullable: false, status: proposta, unit: "kWh", description: "Energia faturada no recorte"}
      receita_faturada:    {type: money,      nullable: false, status: proposta, unit: "R$", description: "Receita faturada no recorte (energia + tributos)"}
      receita_energia:     {type: money,      nullable: false, status: proposta, unit: "R$", description: "Receita de energia no recorte (sem tributos)"}
      tributos:            {type: money,      nullable: false, status: proposta, unit: "R$", description: "Tributos no recorte"}
      receita_arrecadada:  {type: money,      nullable: true,  status: proposta, unit: "R$", description: "Valor efetivamente pago no recorte", note: "vazio quando o recorte não tem fatura na competência (não arrecadar e não ter fatura são coisas diferentes); zero quando há fatura e nada foi pago (DEC-030)"}
      horas_interrompidas: {type: ratio,      nullable: false, status: proposta, unit: "UC·h", description: "Soma das horas de interrupção das UCs do recorte", note: "DEC de um mês = soma de horas ÷ soma de n_uc do mês; de um período = soma de horas ÷ média mensal de n_uc, calculado no portal e no agente sobre o filtro escolhido"}
      n_interrupcoes:      {type: integer,    nullable: false, status: proposta, unit: "contagem", description: "Número de ocorrências das UCs do recorte", note: "FEC de um mês = soma de n_interrupcoes ÷ soma de n_uc do mês; de um período = soma de n_interrupcoes ÷ média mensal de n_uc"}
      n_chamados:          {type: integer,    nullable: false, status: proposta, unit: "contagem", description: "Chamados de atendimento das UCs do recorte, abertos no mês (pela data de abertura)"}
      soma_notas:          {type: ratio,      nullable: true,  status: proposta, unit: "nota", description: "Soma das notas de satisfação (de 1 a 5) dos chamados avaliados", note: "vazio quando nenhum chamado do recorte foi avaliado (n_notas = 0). Guardar soma e contagem, e não a média, para agregar corretamente entre recortes (DEC-030)"}
      n_notas:             {type: integer,    nullable: false, status: proposta, unit: "contagem", description: "Chamados com nota de satisfação", note: "satisfação média = soma de soma_notas ÷ soma de n_notas (ATD-01: chamado sem nota fica fora)"}
      receita_bandeira:    {type: money,      nullable: false, status: proposta, unit: "R$", description: "Parte da receita de energia do recorte que é acréscimo de bandeira", note: "receita_energia - receita_bandeira = receita pela tarifa base (DEC-029)"}
      n_faturas:           {type: integer,    nullable: false, status: proposta, unit: "contagem", description: "Faturas emitidas para as UCs do recorte na competência"}
      n_faturas_nao_pagas: {type: integer,    nullable: false, status: proposta, unit: "contagem", description: "Faturas da competência ainda não pagas na data de corte (em aberto ou em atraso)", note: "situação medida na data de corte, e não no mês da fatura: numa competência antiga, conta as faturas daquele mês que continuam sem pagamento hoje (DEC-027)"}
      valor_nao_pago:      {type: money,      nullable: false, status: proposta, unit: "R$", description: "Valor das faturas da competência ainda não pagas na data de corte", note: "inadimplência do recorte = valor_nao_pago ÷ receita_faturada; mesma semântica da data de corte"}
      n_faturas_pagas_com_atraso: {type: integer, nullable: false, status: proposta, unit: "contagem", description: "Faturas da competência pagas depois do vencimento"}
      soma_dias_em_atraso: {type: integer,    nullable: false, status: proposta, unit: "dias", description: "Soma dos dias de atraso das faturas com atraso (pagas com atraso ou em atraso)", note: "atraso médio = soma_dias_em_atraso ÷ (n_faturas_pagas_com_atraso + faturas em atraso)"}
      n_leituras:          {type: integer,    nullable: false, status: proposta, unit: "contagem", description: "Leituras das UCs do recorte na competência"}
      n_leituras_estimadas: {type: integer,   nullable: false, status: proposta, unit: "contagem", description: "Leituras estimadas (não feitas no medidor) das UCs do recorte na competência", note: "parte de leituras estimadas = n_leituras_estimadas ÷ n_leituras (H5)"}
    checks:
      - "soma por competência de kwh_faturado, receita_faturada e receita_energia = gold_kpis_mensais"
      - "soma por competência e alimentador de n_uc, horas_interrompidas e n_interrupcoes = gold_continuidade_alimentador_mensal"
      - "receita_faturada = receita_energia + tributos por linha (diferença máxima de R$ 0,01)"
      - "índices (DEC, FEC, satisfação) não são guardados: só componentes somáveis, para qualquer filtro dar o mesmo resultado que a empresa inteira"

  gold_continuidade_alimentador_mensal:
    description: "DEC e FEC por alimentador e competência."
    grain: "alimentador × competência"
    primary_key: [cod_alimentador, competencia]
    context: Continuidade
    consumers: [tela DEC/FEC, agente]
    owner: Dados
    columns:
      cod_alimentador:     {type: text,    nullable: false, status: proposta, description: "Alimentador (circuito de média tensão)"}
      competencia:         {type: text,    nullable: false, status: proposta, pattern: '^\d{4}-(0[1-9]|1[0-2])$', description: "Mês de referência"}
      dec:                 {type: ratio,   nullable: false, status: proposta, unit: "h", description: "Duração equivalente de interrupção por UC no alimentador", note: "horas_interrompidas ÷ n_uc (DEC-014)"}
      fec:                 {type: ratio,   nullable: false, status: proposta, unit: "interrupções", description: "Frequência equivalente de interrupção por UC no alimentador", note: "n_interrupcoes ÷ n_uc (DEC-014)"}
      n_uc:                {type: integer, nullable: false, status: proposta, unit: "contagem", description: "UCs faturadas atendidas pelo alimentador na competência, e não só as afetadas", note: "PRODIST: o denominador é o de UCs faturadas; ficam fora as UCs sem fatura no mês, como as da UC-12 (DEC-023)"}
      n_interrupcoes:      {type: integer, nullable: false, status: proposta, unit: "contagem", description: "Número de ocorrências das UCs do alimentador no mês", note: "no case, cada ocorrência corresponde a uma UC interrompida; ocorrência que vira o mês entra no mês da abertura (DEC-014)"}
      horas_interrompidas: {type: ratio,   nullable: false, status: proposta, unit: "UC·h", description: "Soma das durações das ocorrências das UCs do alimentador no mês", note: "consumidor × hora; ocorrência que vira o mês entra no mês da abertura (DEC-014)"}

  gold_interrupcoes_uc:
    description: "Interrupções que afetaram cada UC (UC 360)."
    grain: "UC × ocorrência"
    primary_key: [cod_ocorrencia]
    foreign_keys:
      - {columns: [cod_uc], references: gold_dim_uc.cod_uc}
    context: Continuidade
    consumers: [UC 360, agente]
    owner: Dados
    columns:
      cod_ocorrencia:   {type: text,      nullable: false, status: proposta, description: "Código da ocorrência de rede"}
      cod_uc:           {type: text,      nullable: false, status: proposta, description: "Código da unidade consumidora interrompida"}
      cod_alimentador:  {type: text,      nullable: false, status: proposta, description: "Alimentador da UC (do cadastro)"}
      competencia:      {type: text,      nullable: false, status: proposta, pattern: '^\d{4}-(0[1-9]|1[0-2])$', description: "Mês da abertura da ocorrência", note: "ocorrência que vira o mês entra no mês da abertura (DEC-014)"}
      data_abertura:    {type: timestamp, nullable: false, status: proposta, description: "Início da interrupção"}
      data_encerramento: {type: timestamp, nullable: false, status: proposta, description: "Fim da interrupção"}
      duracao_horas:    {type: ratio,     nullable: false, status: proposta, unit: "h", description: "Duração da interrupção em horas"}
      tipo:             {type: text,      nullable: false, status: proposta, description: "Tipo da ocorrência (ex.: FALTA DE ENERGIA, OSCILACAO)"}
      causa:            {type: text,      nullable: true,  status: proposta, description: "Causa registrada (ex.: CLIMATICA, VEGETACAO); vazia quando não foi registrada (OCO-01)"}
    checks:
      - "soma por competência e alimentador de duracao_horas e contagem = gold_continuidade_alimentador_mensal"
      - "nenhuma ocorrência antes do mês de ligação da UC (DEC-030)"

  gold_atendimentos_uc:
    description: "Chamados de atendimento por UC (UC 360)."
    grain: "UC × chamado"
    primary_key: [protocolo]
    foreign_keys:
      - {columns: [cod_uc], references: gold_dim_uc.cod_uc}
    context: Relacionamento
    consumers: [UC 360, agente]
    owner: Dados
    columns:
      protocolo:        {type: text,      nullable: false, status: proposta, description: "Protocolo do chamado"}
      cod_uc:           {type: text,      nullable: false, status: proposta, description: "Código da unidade consumidora"}
      competencia:      {type: text,      nullable: false, status: proposta, pattern: '^\d{4}-(0[1-9]|1[0-2])$', description: "Mês de abertura do chamado"}
      data_abertura:    {type: timestamp, nullable: false, status: proposta, description: "Abertura do chamado"}
      data_fechamento:  {type: timestamp, nullable: false, status: proposta, description: "Fechamento do chamado"}
      canal:            {type: text,      nullable: false, status: proposta, description: "Canal de entrada (ex.: TELEFONE, APP, WHATSAPP)"}
      assunto:          {type: text,      nullable: false, status: proposta, description: "Assunto do chamado (ex.: FALTA DE ENERGIA, FATURA)"}
      subassunto:       {type: text,      nullable: true,  status: proposta, description: "Detalhe do assunto"}
      nota_satisfacao:  {type: ratio,     nullable: true,  status: proposta, unit: "nota", description: "Nota de satisfação de 1 a 5; vazia quando o cliente não avaliou (ATD-01)"}
    note: "o histórico de interações do chamado (texto livre) fica fora da Gold: é dado sensível e não é usado pelo portal nem pelo agente"

  gold_medidor_uc:
    description: "Medidor vigente de cada UC e o histórico de trocas (UC 360)."
    grain: "1 linha por UC com medidor"
    primary_key: [cod_uc]
    foreign_keys:
      - {columns: [cod_uc], references: gold_dim_uc.cod_uc}
    context: Relacionamento
    consumers: [UC 360, score de suspeita, agente]
    owner: Dados
    columns:
      cod_uc:           {type: text,    nullable: false, status: proposta, description: "Código da unidade consumidora"}
      cod_medidor:      {type: text,    nullable: false, status: proposta, description: "Código do medidor vigente"}
      tipo_medidor:     {type: text,    nullable: false, status: proposta, allowed: [eletromecanico, eletronico, smart], description: "Tipo do medidor vigente"}
      modelo:           {type: text,    nullable: true,  status: proposta, description: "Modelo do medidor vigente"}
      data_instalacao:  {type: date,    nullable: false, status: proposta, description: "Instalação do medidor vigente"}
      idade_anos:       {type: ratio,   nullable: false, status: proposta, unit: "anos", description: "Idade do medidor vigente no fim da última competência dos dados"}
      n_trocas:         {type: integer, nullable: false, status: proposta, unit: "contagem", description: "Medidores já retirados da UC"}
      data_ultima_troca: {type: date,   nullable: true,  status: proposta, description: "Retirada do medidor anterior; vazia se nunca houve troca"}
    note: "UCs sem medidor (UC-12) não têm linha. A data da última manutenção não existe na origem (MED-06), então 'medidor sem manutenção' não é respondível"

  gold_inspecoes_uc:
    description: "Inspeções de campo por UC: histórico na UC 360, taxa de irregularidade por recorte (H2) e régua da fila de suspeitas."
    grain: "UC × inspeção"
    primary_key: [cod_inspecao]
    foreign_keys:
      - {columns: [cod_uc], references: gold_dim_uc.cod_uc}
    context: Perdas
    consumers: [UC 360, tela Perdas, diagnóstico]   # fora do agente, como a fila de suspeitas (decisão de produto)
    owner: Dados
    columns:
      cod_inspecao:     {type: text,       nullable: false, status: proposta, description: "Código da inspeção"}
      cod_uc:           {type: text,       nullable: false, status: proposta, description: "Código da unidade consumidora inspecionada"}
      data_inspecao:    {type: date,       nullable: false, status: proposta, description: "Data da inspeção (vale a data, não a aba de origem: INSP-05)"}
      competencia:      {type: text,       nullable: false, status: proposta, pattern: '^\d{4}-(0[1-9]|1[0-2])$', description: "Mês da inspeção"}
      resultado:        {type: text,       nullable: false, status: proposta, allowed: [irregularidade_confirmada, sem_irregularidade], description: "Resultado da inspeção"}
      tipo_irregularidade: {type: text,    nullable: true,  status: proposta, description: "Tipo da irregularidade (ex.: DESVIO DIRETO, BY-PASS); vazio sem irregularidade"}
      kwh_recuperado:   {type: energy_kwh, nullable: false, status: proposta, unit: "kWh", description: "Energia recuperada com a regularização; zero sem irregularidade"}
    note: "o nome do inspetor fica fora da Gold (dado pessoal sem uso no portal)"

  gold_reconciliacao_faturamento:
    description: "Ponte do faturamento e da energia, do número bruto até o usado nos indicadores, por competência, com cada parcela e o motivo."
    grain: "1 linha por competência"
    primary_key: [competencia]
    context: Receita
    consumers: [diagnóstico, tela Receita, agente]
    owner: Dados
    columns:
      competencia:                  {type: text,       nullable: false, status: proposta, pattern: '^\d{4}-(0[1-9]|1[0-2])$', description: "Mês de referência"}
      receita_faturada_total:       {type: money,      nullable: false, status: proposta, unit: "R$", description: "Soma de todas as faturas da competência (energia + tributos), inclusive as de UCs fora do cadastro"}
      receita_faturada_orfas:       {type: money,      nullable: false, status: proposta, unit: "R$", description: "Parte da receita total em faturas de UCs fora do cadastro", note: "ficam fora do fato por UC, mas nunca são descartadas (FAT-05)"}
      receita_faturada_cadastro:    {type: money,      nullable: false, status: proposta, unit: "R$", description: "Receita total das UCs do cadastro; igual à soma de receita_faturada em gold_fato_faturamento_mensal"}
      tributos_cadastro:            {type: money,      nullable: false, status: proposta, unit: "R$", description: "Tributos das faturas das UCs do cadastro"}
      receita_energia_cadastro:     {type: money,      nullable: false, status: proposta, unit: "R$", description: "Receita de energia das UCs do cadastro, base dos indicadores e do PVM (DEC-066)"}
      n_faturas_orfas:              {type: integer,    nullable: false, status: proposta, unit: "contagem", description: "Faturas de UCs fora do cadastro"}
      kwh_leitura_total:            {type: energy_kwh, nullable: false, status: proposta, unit: "kWh", description: "Soma do consumo apurado nas leituras, sem correção", note: "as UCs fora do cadastro não têm leitura, então a ponte de energia é só do cadastro"}
      kwh_correcao_troca_medidor:   {type: energy_kwh, nullable: false, status: proposta, unit: "kWh", description: "Ajuste das trocas de medidor: leitura atual no lugar do consumo negativo", note: "soma de (kwh_faturado - kwh_leitura) onde origem_kwh = leitura_atual_troca_medidor"}
      kwh_correcao_sinal_invertido: {type: energy_kwh, nullable: false, status: proposta, unit: "kWh", description: "Ajuste do consumo com o sinal invertido: valor absoluto no lugar do consumo negativo", note: "soma de (kwh_faturado - kwh_leitura) onde origem_kwh = consumo_absoluto"}
      kwh_faturado_total:           {type: energy_kwh, nullable: false, status: proposta, unit: "kWh", description: "Energia faturada final, já líquida de GD; igual à soma de kwh_faturado em gold_fato_faturamento_mensal"}
    checks:
      - "receita_faturada_total = receita_faturada_cadastro + receita_faturada_orfas (diferença máxima de R$ 0,01)"
      - "receita_faturada_cadastro = receita_energia_cadastro + tributos_cadastro (diferença máxima de R$ 0,01)"
      - "kwh_faturado_total = kwh_leitura_total + kwh_correcao_troca_medidor + kwh_correcao_sinal_invertido (diferença máxima de 0,001 kWh)"
      - "receita_faturada_cadastro, receita_energia_cadastro, tributos_cadastro e kwh_faturado_total = soma por competência de gold_fato_faturamento_mensal"

  gold_fila_suspeitas:
    description: "UCs suspeitas de perda não técnica, ordenadas por prioridade."
    grain: "1 linha por UC suspeita"
    primary_key: [cod_uc]
    foreign_keys:
      - {columns: [cod_uc], references: gold_dim_uc.cod_uc}
    context: Perdas
    consumers: [tela Perdas, ordens de inspeção]   # fora do agente por padrão: decisão de produto (lista de suspeitos)
    owner: Dados
    columns:
      cod_uc:              {type: text,       nullable: false, status: proposta, description: "Código da unidade consumidora suspeita"}
      score_suspeita:      {type: integer,    nullable: false, status: proposta, unit: "posição", description: "Posição da UC no ranking de suspeita: 1 = mais suspeita", note: "posição no ranking, não nota (decisão da daily de 21/10)"}
      motivos:             {type: text_array, nullable: false, status: proposta, description: "Regras ou fatores que mais explicam o score, em texto legível", note: "no CSV, itens separados por ; na mesma célula"}
      kwh_recuperavel_est: {type: energy_kwh, nullable: true,  status: proposta, unit: "kWh/mês", description: "Energia estimada a recuperar por mês se a irregularidade for confirmada"}

# Fora da Gold: app.ordem_inspecao e app.ordem_evento (modelo de escrita da aplicação), que o loader da
# Gold nunca altera.

open_questions:
  - "Três cópias da Silver -> Gold (DECIDIDO, DEC-011 e DEC-030): Alisson, Arthur e Gabriel fizeram cópias independentes contra este contrato; as três bateram tabela por tabela, e a do Alisson virou a base do notebook oficial. A Gold oficial foi conferida contra ela no QA de 27/10 (mesmas contagens e mesmo conteúdo nas 12 tabelas)."
  - "Período base (DECIDIDO, DEC-028): gold_receita_decomposicao grava os pares de mesmos meses em anos diferentes; os demais pares passariam de 1 bilhão de linhas e ficam para o backend calcular na hora, se necessário. docs/arquitetura.md já descreve qualquer par de períodos; docs/planejamento.md guarda a proposta original da kickoff."
  - "Tabelas da UC 360 (DECIDIDO, DEC-027): gold_interrupcoes_uc, gold_atendimentos_uc e gold_medidor_uc com colunas e chave, e gold_inspecoes_uc nova."
  - "Precisão numérica e normalização (DECIDIDO): money = numeric(14,2) e energy_kwh = numeric(16,3), aplicados pelo notebook Silver_to_Gold; município sem problema na origem e bairro com uma grafia por município depois da correção de encoding (UC-13)."
  - "Titular na UC 360 (DECIDIDO, DEC-023): a Gold traz só titular_mascarado (iniciais) e documento_mascarado (3 últimos dígitos), ambos sensitive. Não há cod_cliente: a origem não tem código de cliente e, no dataset, cada titular tem uma UC só, exceto um documento de preenchimento repetido em um grupo de UCs cadastradas sem nenhum medidor (verificado: o grupo é exatamente o das UCs sem medidor, e o documento não é nulo). Esse grupo são as UCs de teste do cadastro (UC-12, DEC-067)."
  - "Gold fora do repositório (DECIDIDO, DEC-004 e DEC-024): os CSVs da Gold ficam no Volume do Databricks e em data/gold/, fora do Git; no repositório público só sobe o resultado agregado que a DEC-024 permite."
  - "classe x subgrupo (DECIDIDO: opção B, DEC-023): o glossário do case chama de 'classe de consumo' os grupos B1, B2, B3 e A4, e o B3 junta comercial e poder público; a diretoria pergunta por 'receita comercial' e 'volume residencial', e a Silver traz as duas informações (classe com 5 nomes e subgrupo_tarifario B1/B2/B3/A4, com cada classe em um só subgrupo). Opção A: classe passa a ter os 5 nomes e subgrupo guarda B1/B2/B3/A4. Opção B: classe continua B1/B2/B3/A4, como no case, e entra uma coluna nova com os 5 nomes. A opção A muda o domínio de classe, que hoje é usado pelo backend (teste do contrato) e pela camada semântica do agente (regra 'classe tem exatamente B1, B2, B3 e A4' e exemplos); a opção B só acrescenta coluna."
  - "Base da receita (DECIDIDO, DEC-066): o teste declarado da DEC-023 foi feito no diagnóstico (docs/diagnostico-receita.md, seções 2 e 4): a receita varia +8,00% com e sem tributos, então as duas definições reproduzem a variação citada pela diretoria. receita_energia continua a base do PVM e da tarifa_media, porque tributos não são receita da distribuidora; nenhum número mudou."
  - "kwh_faturado x consumo_kwh (VALIDADO, DEC-023): a fatura não tem kWh, e a energia faturada vem do consumo_kwh das leituras. O case diz que a energia da GD é abatida do consumo faturado. Teste: para as UCs com GD, a queda do consumo médio depois da conexão (até 12 meses de cada lado, mínimo 6) dividida pela energia injetada média mensal fica em torno de 1 (mediana próxima de 1, todas dentro de 0,7 a 1,3), então o consumo da leitura já é líquido de GD e não precisa de correção."
  - "Regra de kwh_faturado (VALIDADA contra a fatura, DEC-023): troca de medidor -> leitura_atual; consumo negativo sem troca (sinal invertido) -> valor absoluto; demais -> consumo_kwh. Teste: o kWh implícito da fatura (valor_energia ÷ tarifa mediana do subgrupo na competência, calculada só com leituras limpas) reproduz kwh_faturado dentro de 2% em todos os grupos sinalizados. Os dois grupos de leitura negativa são exclusivos e completos: todas as leituras sinalizadas pelo notebook de Silver são negativas, e cada uma cai em exatamente uma regra."
  - "Efeito bandeira e efeito GD (DECIDIDO, DEC-023): efeito_preco passa a ser efeito_tarifa + efeito_bandeira, e possui_gd entra no grão de gold_receita_decomposicao, de modo que o efeito GD é o efeito volume das linhas com possui_gd = true. Método (DECIDIDO, DEC-029): no dado, a bandeira é um acréscimo fixo por kWh, igual em todas as classes; efeito_tarifa usa a receita sem o acréscimo, e efeito_bandeira a variação do acréscimo. As parcelas fecham com a variação total por construção (conferido por trava)."
  - "KPIs por recorte (DECIDIDO, DEC-023): gold_kpis_segmento_mensal guarda componentes somáveis por mês, município, bairro, classe e geração própria (possui_gd), para o filtro da diretoria, do portal e do agente; qualquer período é a soma das competências escolhidas. gold_kpis_mensais continua como total da empresa, e as duas são conferidas entre si. Os componentes de atendimento (n_chamados, soma_notas, n_notas) saem da Silver de atendimentos, que já existe, e contam o chamado pelo mês de abertura."
  - "possui_gd por competência (DECIDIDO, DEC-023): em gold_kpis_segmento_mensal, a UC conta como com GD a partir do mês da conexão. Em gold_receita_decomposicao, possui_gd é o estado no último mês do período atual e vale para a UC nos dois períodos, base e atual: a UC que conectou a GD entre eles fica no grupo com GD dos dois lados, para o PVM comparar as mesmas UCs e o efeito GD ser a queda de volume delas. Por isso a soma de possui_gd = true no período base da decomposição pode diferir da tabela mensal."
  - "Faturas de UCs fora do cadastro (DECIDIDO, DEC-023, flag_uc_orfa): ficam fora do fato por UC (não há UC para ligar), mas não são descartadas: entram em gold_reconciliacao_faturamento, que também traz a ponte da energia (DEC-023). Limite: sem cadastro, não dá para cruzá-las com município, bairro ou classe."
  - "Pares da decomposição (DECIDIDO, DEC-028): a Gold grava todos os pares de mesmos meses em anos diferentes; pares de trechos diferentes ficam para o backend calcular na hora, se o portal precisar (gravar todos passaria de 1 bilhão de linhas)."
  - "Ocorrências registradas antes da ligação da UC (DECIDIDO, DEC-030): ficam fora da Gold (OCO-04)."
  - "UCs de teste do cadastro (DECIDIDO, DEC-067): o grupo da UC-12 tem cod_uc com prefixo TESTE e nenhuma fatura, medidor, ocorrência, chamado ou inspeção. Fica na gold_dim_uc até depois da entrega; a exclusão exigiria regravar Silver e Gold perto do code freeze."

