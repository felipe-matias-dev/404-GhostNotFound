# Databricks Workflow (Job) do pipeline Medalhão do V-Energy Grid 360 (DEC-039).
# Exportado do Databricks em "View as code > YAML".
#
# Landing -> Bronze -> Silver -> Gold + export dos 12 CSVs da Gold (/Volumes/v_energy/gold/csv, DEC-004).
# - Notebooks lidos do GitHub (branch main): o Job roda o código revisado, não uma cópia do workspace.
# - Compute serverless. Os widgets têm "gravar = nao" como padrão; o Job passa "sim" em cada task.
# - exigir_idempotencia = nao: a Bronze continua conferida contra a origem; só a comparação por time travel com a gravação
#   anterior é pulada (expira em 7 dias e não se aplica a dado novo). Ver DEC-039.
# - Uma falha numa task interrompe as seguintes: o Resumo de cada notebook dá erro se alguma tabela falhar.
# - Reprocessa tudo a cada run (full refresh), em vez da carga incremental da ADR-07: ver DEC-039.
# - Agendamento mensal, dia 6 às 03h (D+5 do fechamento do faturamento, suposição), pausado: o dataset do case é uma extração única.
resources:
  jobs:
    v_energy_workflow:
      name: v_energy_workflow
      timeout_seconds: 7200
      schedule:
        quartz_cron_expression: 40 0 3 6 * ?
        timezone_id: America/Fortaleza
        pause_status: PAUSED
      tasks:
        - task_key: landing_to_bronze
          notebook_task:
            notebook_path: data-engineering/notebooks/Landing_to_Bronze
            base_parameters:
              gravar: sim
              landing_path: /Volumes/v_energy/default/landing
              exigir_idempotencia: nao
            source: GIT
          environment_key: Default
        - task_key: bronze_to_silver
          depends_on:
            - task_key: landing_to_bronze
          notebook_task:
            notebook_path: data-engineering/notebooks/Bronze_to_Silver
            base_parameters:
              gravar: sim
            source: GIT
          environment_key: Default
        - task_key: silver_to_gold_export
          depends_on:
            - task_key: bronze_to_silver
          notebook_task:
            notebook_path: data-engineering/notebooks/Silver_to_Gold
            base_parameters:
              gravar: sim
              exportar_csv: sim
              schema_gold: gold
            source: GIT
          environment_key: Default
      git_source:
        git_url: https://github.com/felipe-matias-dev/404-GhostNotFound
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
      performance_target: PERFORMANCE_OPTIMIZED
