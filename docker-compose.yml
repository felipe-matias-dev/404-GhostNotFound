# Ambiente local do V-Energy Grid 360: banco, API e frontend. Na raiz, com o .env criado:
#   tudo:          docker compose up -d --wait   (portal em http://localhost:3000)
#   só o banco:    docker compose up -d --wait db   (para rodar API e frontend fora do Docker)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: venergy
      POSTGRES_USER: venergy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env da raiz}
      # Lida pelo script de inicialização para criar o usuário somente leitura do agente.
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:?defina AGENT_DB_PASSWORD no .env da raiz}
    ports:
      # Só localhost: o banco não fica exposto na rede. 5433 por padrão para não colidir
      # com um PostgreSQL já instalado na máquina, que costuma ocupar a 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venergy -d venergy"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # Contexto na raiz: a imagem da API instala o agente de IA pelo workspace do uv (DEC-017).
    build:
      context: .
      dockerfile: backend/Dockerfile
    # --reload reinicia a API a cada mudança no código da API ou do agente, montados logo abaixo.
    command: uvicorn venergy_api.main:create_app --factory --host 0.0.0.0 --port 8000 --reload --reload-dir backend/src --reload-dir ai-agent/src
    environment:
      # Na rede do compose, o banco é o serviço db na porta padrão do PostgreSQL.
      VENERGY_API_DATABASE_URL: postgresql+psycopg://venergy:${POSTGRES_PASSWORD}@db:5432/venergy
      VENERGY_API_GOLD_DIR: /data/gold
      # Assina o token de sessão do login. Sem ele a API não sobe: o compose para com a mensagem.
      VENERGY_API_JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (veja o .env.example)}
      # Senha dos usuários de demonstração: lida só por `python -m venergy_api.usuarios`.
      VENERGY_API_SENHA_DEMO: ${SENHA_DEMO:-}
      # Agente de IA: usuário somente leitura e chave do Gemini de cada integrante (.env da raiz).
      VENERGY_AGENT_DATABASE_URL: postgresql://venergy_agent:${AGENT_DB_PASSWORD}@db:5432/venergy
      VENERGY_AGENT_GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      # Detecção de mudanças por varredura: eventos do sistema de arquivos não atravessam
      # o volume no Docker Desktop do Windows.
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./backend/src:/app/backend/src
      - ./ai-agent/src:/app/ai-agent/src
      # Camada semântica do agente (semantic_layer.yaml e views.sql): a carga aplica o views.sql
      # e o agente lê o YAML. Montada para valer a versão do repositório, não a do último build.
      - ./ai-agent/semantic:/app/ai-agent/semantic
      # CSVs da Gold (data/gold/), lidos pela carga e escritos pelo gerador da amostra.
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      # O proxy /api do Vite encaminha para a API pela rede do compose: o navegador fala só
      # com o Vite, sem CORS.
      API_PROXY_TARGET: http://api:8000
      # Mesmo motivo do WATCHFILES_FORCE_POLLING da API.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      # Só src/: o node_modules é o da imagem (binários para Linux), nunca o da sua máquina.
      # Mudou package.json ou vite.config.ts? docker compose up -d --build web
      - ./frontend/src:/app/src
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
